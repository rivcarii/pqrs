# Avisa (y abre un PR) cuando una dependencia o una acción de GitHub tiene una versión con correcciones de seguridad.
version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule: { interval: "weekly" }
    open-pull-requests-limit: 5
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule: { interval: "weekly" }
