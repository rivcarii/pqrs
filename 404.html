<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<link rel="icon" type="image/png" href="favicon.png">
<title>Sistema PQRS · MiRed IPS</title>
<style>body{margin:0;min-height:100vh;display:grid;place-items:center;font-family:"Volkswagen Serial","Barlow",Arial,sans-serif;background:linear-gradient(160deg,#005A78,#00475F 60%,#00323F);color:#fff;text-align:center;padding:20px;box-sizing:border-box}
.c{max-width:420px}h1{font-size:24px;margin:0 0 10px}p{margin:0 0 18px;line-height:1.5;color:rgba(255,255,255,.85)}a{display:inline-block;background:#FEDC00;color:#2E2500;font-weight:700;text-decoration:none;border-radius:99px;padding:12px 22px}</style>
</head>
<body><div class="c"><h1>Te llevamos a la plataforma</h1><p id="t">Esa dirección ya no existe, pero la plataforma de PQRS sigue disponible.</p><a id="a" href="portal/">Abrir el Sistema de PQRS</a></div>
<script>
/* GitHub Pages sirve este archivo cuando una dirección del sitio no existe (por ejemplo, la de antes de un cambio de nombre).
   Se redirige solo al portal, conservando lo que venía después del «?» (como el radicado de un aviso). */
(function(){
  var seg = location.pathname.split("/").filter(Boolean);
  var base = location.hostname.slice(-10) === "github.io" && seg.length ? "/" + seg[0] + "/" : "/";
  var resto = location.search + location.hash, a = document.getElementById("a");
  function ir(d){ a.href = d; setTimeout(function(){ location.replace(d); }, 1000); }
  /* según cómo se publique el sitio, la plataforma está en «…/portal/» o en la raíz: se comprueba y se va a donde exista */
  fetch(base + "portal/manifest.webmanifest", { method: "HEAD" }).then(function(r){ ir(base + (r.ok ? "portal/" : "") + resto); }).catch(function(){ ir(base + "portal/" + resto); });
})();
</script>
</body>
</html>
