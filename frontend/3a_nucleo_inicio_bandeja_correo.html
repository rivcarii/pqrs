<script>
/* v8 · PORTAL: fuera de Apps Script (página publicada con dirección propia) las llamadas viajan por fetch
   a la URL /exec de la implementación. Dentro de Apps Script se usa google.script.run como siempre. */
(function(){
  if(window.google && google.script && google.script.run) return;
  var API = window.PQRS_API || "";
  try {
    var q = /[?&]api=([^&]+)/.exec(location.search);
    if(q && /^https:\/\/script\.google(usercontent)?\.com\//.test(decodeURIComponent(q[1]))) { API = decodeURIComponent(q[1]); localStorage.setItem("pqrs_api", API); }
    if(!API) API = localStorage.getItem("pqrs_api") || "";
  } catch(e) {}
  function Runner(ok, mal){ this._ok = ok; this._mal = mal; }
  Runner.prototype.withSuccessHandler = function(f){ return new Runner(f, this._mal); };
  Runner.prototype.withFailureHandler = function(f){ return new Runner(this._ok, f); };
  ["estadoAcceso","iniciarSesion","cerrarSesion","crearPrimerAdministrador","api"].forEach(function(fn){
    Runner.prototype[fn] = function(){
      var args = Array.prototype.slice.call(arguments), ok = this._ok || function(){}, mal = this._mal || function(){};
      if(!API){ mal(new Error("Esta página no tiene configurada la dirección de la plataforma (URL que termina en /exec). Pídesela al administrador.")); return; }
      fetch(API, { method:"POST", redirect:"follow", headers:{ "Content-Type":"text/plain;charset=utf-8" }, body: JSON.stringify({ fn:fn, args:args }) })
        .then(function(r){
          if(!r.ok) throw new Error(r.status === 404 ? "La dirección de la plataforma ya no existe (error 404): se publicó otra versión con una dirección distinta." : "La plataforma respondió con el código "+r.status+".");
          return r.json().catch(function(){ throw new Error("La plataforma no respondió como se esperaba: puede estar en mantenimiento o la dirección cambió."); });
        })
        .then(function(j){ if(j && j.__error) mal(new Error(j.__error)); else ok(j ? j.r : null); })
        .catch(function(e){ mal(e && e.message && /fetch|network/i.test(e.message) ? new Error("Sin conexión con la plataforma. Revisa tu internet e inténtalo de nuevo.") : e); });
    };
  });
  window.google = window.google || {};
  window.google.script = { run: new Runner(), url: { getLocation: function(cb){
    var p = {}; location.search.replace(/^\?/,"").split("&").forEach(function(kv){ if(!kv) return; var a = kv.split("="); p[decodeURIComponent(a[0])] = decodeURIComponent((a[1]||"").replace(/\+/g," ")); });
    cb({ parameter:p, hash:location.hash }); } } };
  window.PQRS_PORTAL = true;
})();

var APP = { listas:{}, responsables:[], usuario:"", detalle:null, bandeja:[], mapeo:null,
            etapa:"sin_direccionar", plantillas:[], correo:null, correoCat:"institucional", correosCargados:false,
            anio:null, resumenAnual:null, desde:0, ticks:0, notifs:[], propios:{}, correoPrevio:null };
var APP_INICIAL = JSON.stringify(APP);   /* v7.1: al cerrar sesión se vuelve a este estado (nada del usuario anterior queda en memoria) */
var CICLO = null;

/* ============================ utilidades ============================ */
function $(id){ return document.getElementById(id); }
function esc(s){ return (s===null||s===undefined?"":String(s))
  .replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;"); }
function ic(n, cl){ return '<svg class="ic'+(cl?" "+cl:"")+'"><use href="#i-'+n+'"/></svg>'; }
function llenar(id, ops, vacio){
  var s=$(id); if(!s) return;
  s.innerHTML="";
  if(vacio!==false) s.appendChild(new Option("— Seleccionar —",""));
  (ops||[]).forEach(function(o){ s.appendChild(new Option(o,o)); });
}
function hoyISO(){ var d=new Date();
  return d.getFullYear()+"-"+("0"+(d.getMonth()+1)).slice(-2)+"-"+("0"+d.getDate()).slice(-2); }
function norm(s){ return (s||"").toString().toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"").trim(); }
function claseSem(s){ s=s||"";
  if(s.indexOf("🔴")===0) return "r"; if(s.indexOf("🟡")===0) return "a";
  if(s.indexOf("🟢")===0) return "v"; if(s.indexOf("⭐")===0) return "f";
  if(s.indexOf("⚠")===0) return "a"; if(s.indexOf("✅")===0) return "c"; return "c"; }
/* La hoja guarda el semáforo con un símbolo al inicio; la interfaz muestra solo el texto. */
function textoSem(s){ return (s||"").toString().replace(/^[^A-Za-z0-9ÁÉÍÓÚÑáéíóúñ]+/,"").trim() || "Sin dato"; }
function chip(s){ return '<span class="chip '+claseSem(s)+'">'+esc(textoSem(s))+'</span>'; }
function dias(v){ var n=Number(v); return (v===""||v===null||v===undefined||isNaN(n)) ? "" : Math.max(0,Math.round(n)); }
var MESES=["Enero","Febrero","Marzo","Abril","Mayo","Junio","Julio","Agosto","Septiembre","Octubre","Noviembre","Diciembre"];

/* Colores por tipo de PQRS: paleta del logo MiRed (orden validado para daltonismo). */
var TIPOS_ORDEN = ["Queja","Petición","Sugerencia","Felicitación","Reclamo","Tutela","Denuncia"];
var TIPO_COLOR = { "queja":"#E20A31", "peticion":"#7B4FB8", "sugerencia":"#1F6FD1", "felicitacion":"#009C4D",
                   "reclamo":"#F29D00", "tutela":"#374151", "denuncia":"#B4531A" };
function colorTipo(t){ var k=norm(t); for(var p in TIPO_COLOR){ if(k.indexOf(p)===0) return TIPO_COLOR[p]; } return "#8398A3"; }
function tipoTag(t){ return '<span class="tipo"><i style="background:'+colorTipo(t)+'"></i>'+esc(t||"Sin clasificar")+'</span>'; }
function ordenarTipos(obj){
  return Object.keys(obj||{}).sort(function(a,b){
    var ia=TIPOS_ORDEN.map(norm).indexOf(norm(a)), ib=TIPOS_ORDEN.map(norm).indexOf(norm(b));
    return (ia<0?99:ia)-(ib<0?99:ib);
  });
}

function aviso(cont, texto, tipo){
  var el=$(cont); if(!el) return;
  var i = tipo==="err" ? "alerta" : (tipo==="ok" ? "check" : "pulso");
  el.innerHTML = texto ? '<div class="aviso '+(tipo||"info")+'">'+ic(i,"s")+'<div>'+texto+'</div></div>' : "";
}

/* Llamadas al servidor con indicador de carga global. */
var enVuelo = 0;
function carga(delta){ enVuelo=Math.max(0,enVuelo+delta); $("carga").classList.toggle("on", enVuelo>0); if(window.pillCarga) window.pillCarga(enVuelo>0); }
/* Toda llamada pasa por api(token, función, argumentos): el servidor valida sesión, rol y sede. */
var TOKEN = null;
try { TOKEN = sessionStorage.getItem("pqrs_token") || localStorage.getItem("pqrs_token"); } catch(e) {}
function llamar(fn, args, conCarga){
  return new Promise(function(ok, mal){
    if(!TOKEN) return;   /* sin sesión no se consulta nada (p. ej. un temporizador que quedó pendiente al salir) */
    if(conCarga) carga(1);
    var token = TOKEN;   /* si la sesión cambia mientras llega la respuesta, se descarta (no se mezclan datos entre usuarios) */
    google.script.run.withSuccessHandler(function(x){
      if(conCarga) carga(-1);
      if(TOKEN !== token) return;
      if(x && x.__sesion === false){ sesionTerminada(x.mensaje); mal(new Error(x.mensaje)); return; }
      if(x && x.__cambiarClave){ if($("modal").hidden) cambiarClave(true); mal(new Error(x.mensaje)); return; }   /* contraseña temporal: solo se puede cambiarla */
      ok(x);
    }).withFailureHandler(function(e){ if(conCarga) carga(-1); if(TOKEN !== token) return; mal(e); }).api(token, fn, args);
  });
}
function srv(fn){ return llamar(fn, Array.prototype.slice.call(arguments,1), true); }
function srvSilencioso(fn){ return llamar(fn, Array.prototype.slice.call(arguments,1), false); }
/* Funciones públicas (antes de iniciar sesión). */
function pub(fn){
  var args = Array.prototype.slice.call(arguments,1);
  return new Promise(function(ok, mal){
    carga(1);
    var r = google.script.run.withSuccessHandler(function(x){ carga(-1); ok(x); }).withFailureHandler(function(e){ carga(-1); mal(e); });
    r[fn].apply(r, args);
  });
}
function msgErr(e){ return esc(e && e.message ? e.message : e); }
function ocupado(id, texto){
  var b = (typeof id==="string") ? $(id) : id; if(!b) return function(){};
  var antes=b.innerHTML; b.disabled=true; b.innerHTML='<span class="spin"></span>'+esc(texto);
  return function(){ b.disabled=false; b.innerHTML=antes; };
}
function esqueleto(n){ var h='<div class="sk-lista">'; for(var i=0;i<(n||5);i++) h+='<div class="sk sk-fila"></div>'; return h+'</div>'; }
function vacio(icono, texto){ return '<div class="vacio">'+ic(icono)+'<div>'+texto+'</div></div>'; }
function contar(el, fin){
  var n=Number(fin); if(!el || isNaN(n) || n<=0){ if(el) el.textContent=fin; return; }
  var t0=null, dur=650;
  function paso(t){ if(!t0) t0=t; var p=Math.min(1,(t-t0)/dur); el.textContent=Math.round(n*(1-Math.pow(1-p,3))); if(p<1) requestAnimationFrame(paso); }
  requestAnimationFrame(paso);
}
function animarNumeros(raiz){ (raiz||document).querySelectorAll("[data-n]").forEach(function(el){ contar(el, el.dataset.n); }); }

/* ============================ navegación ============================ */
var TITULOS = { inicio:["Inicio","Resumen de tus sedes"], bandeja:["Bandeja de PQRS","Gestión por etapas"], prioritarias:["Prioritarias","Riesgo vital, priorizadas y términos cortos"], correo:["Correo y EPS","Canal de correo unificado"],
  detalle:["Detalle de la PQRS","Gestión y trazabilidad"], radicar:["Radicar PQRS","Ventanilla, buzón y teléfono"], ficha:["Ficha del formulario","Para imprimir y ubicar en tu sede"], tablero:["Tablero","Indicadores por mes y sede"],
  responsables:["Directorio de áreas","Quién recibe cada solicitud"], hub:["Módulos","Todo el SIAU en un solo lugar"], modulo:["Módulo","Se ejecuta dentro de la plataforma"], usuarios:["Usuarios y sedes","Accesos a la plataforma"], config:["Configuración","Automatización y canales"] };
/* Pastilla que se desliza hasta el apartado activo del menú (movimiento en lugar de saltos). */
function moverPastilla(){
  var menu = $("menu"); if(!menu) return;
  var on = menu.querySelector("button.on"), p = menu.querySelector(".pastilla");
  if(!on || !on.offsetHeight){ if(p) p.style.opacity = 0; return; }
  if(!p){ p = document.createElement("i"); p.className = "pastilla"; menu.insertBefore(p, menu.firstChild); }
  p.style.opacity = 1; p.style.height = on.offsetHeight + "px"; p.style.transform = "translateY(" + on.offsetTop + "px)";
  menu.classList.add("con-pastilla");
}
window.addEventListener("resize", function(){ moverPastilla(); });
function ver(v){
  var permitido = document.querySelector('#menu [data-v="'+v+'"]');
  if(permitido && permitido.hidden) v = "inicio";
  if(v === "modulo" && !(APP.sesion && APP.sesion.puede && APP.sesion.puede.admin)) v = "inicio";   /* los módulos propios solo son del administrador */
  if(TITULOS[v]){ $("tituloVista").textContent = TITULOS[v][0]; $("subVista").textContent = TITULOS[v][1]; }
  cerrarLateral();
  ["inicio","bandeja","prioritarias","correo","detalle","radicar","ficha","tablero","responsables","hub","modulo","usuarios","config"].forEach(function(x){
    var s=$("v-"+x); if(!s) return;
    s.hidden = (x!==v);
    if(x===v){ s.classList.remove("anim"); void s.offsetWidth; s.classList.add("anim"); }
  });
  document.querySelectorAll("nav button[data-v]").forEach(function(b){
    b.classList.toggle("on", b.dataset.v===v || (v==="detalle" && b.dataset.v==="bandeja") || (v==="modulo" && b.dataset.v==="hub"));
  });
  $("menuPerfil").hidden = true;
  $("centro").hidden = true;
  moverPastilla();
  if(v==="inicio") cargarInicio();
  if(v==="ficha") cargarFicha();
  if(v==="tablero") cargarTablero();
  if(v==="prioritarias") cargarPrioritarias();
  if(v==="correo"){ $("vistaHilo").hidden = true; $("vistaLista").hidden = false; if(!APP.correosCargados) buscarCorreos(); }
  if(v==="responsables") pintarResponsables();
  if(v==="hub") cargarHub();
  if(v==="usuarios") cargarUsuarios();
  if(v==="config"){ cargarAjustes(); cargarQR(); }
  window.scrollTo({top:0});
  try { if(window.riverinoVista) window.riverinoVista(v); } catch(e) {}
}
document.querySelectorAll("nav button[data-v]").forEach(function(b){
  b.addEventListener("click", function(){ ver(b.dataset.v); if(b.dataset.v==="bandeja") cargarBandeja(); });
});

/* ============================ arranque ============================ */
function arrancar(d){
  APP.listas = d.listas || {}; APP.responsables = d.responsables || []; APP.usuario = d.usuario;
  APP.sesion = d.sesion || { rol:"Administrador", todas:true, puede:{gestion:true,correo:true,admin:true}, sedes:["TODAS"], nombre:d.usuario };
  APP.categorias = d.categorias || [];
  aplicarSesion();
  APP.desde = d.ahora || Date.now();
  if(d.logo && !window.IMG_MIRED) $("logo").src = "data:image/png;base64," + d.logo;
  $("quien").textContent = APP.sesion.nombre || d.usuario || "";
  var L = APP.listas;
  var canalesManual = ["Presencial","Buzón de sugerencias","Telefónico","Correspondencia física","Correo electrónico","Redes sociales","WhatsApp"];
  (L["CANAL"]||[]).forEach(function(c){ if(!/qr|formul/i.test(c) && canalesManual.map(norm).indexOf(norm(c))===-1) canalesManual.push(c); });
  llenar("r_canal", canalesManual); llenar("r_tipoSolicitante", L["TIPO SOLICITANTE"]);
  llenar("r_tipoDocSolicitante", L["TIPO DOCUMENTO"]); llenar("r_tipoDocAfiliado", L["TIPO DOCUMENTO"]);
  llenar("r_sexo", L["SEXO"]); llenar("r_poblacion", L["POBLACIÓN DIFERENCIAL"]);
  llenar("r_eps", L["EPS / PRESTADOR"]); llenar("r_regimen", L["RÉGIMEN"]);
  llenar("r_sede", L["SEDE"]); llenar("r_servicio", L["SERVICIO"]);
  llenar("r_modalidad", L["MODALIDAD DE ATENCIÓN"]); llenar("r_tipoPqrs", L["TIPO DE PQRS"]);
  llenar("r_entidad", L["ENTIDAD PRESENTADA"]); llenar("r_tipologia", L["MOTIVO ESPECÍFICO"] || L["TIPOLOGÍA"]);
  llenar("fEstado", L["ESTADO"], false); llenar("fCanal", L["CANAL"], false);
  $("fEstado").insertBefore(new Option("Todos",""), $("fEstado").firstChild); $("fEstado").value="";
  $("fCanal").insertBefore(new Option("Todos",""), $("fCanal").firstChild); $("fCanal").value="";
  llenar("fTipo", L["TIPO DE PQRS"], false); $("fTipo").insertBefore(new Option("Todos",""), $("fTipo").firstChild); $("fTipo").value="";
  llenar("fSede", L["SEDE"], false); $("fSede").insertBefore(new Option("Todas",""), $("fSede").firstChild); $("fSede").value="";
  valoresPorDefecto();
  if (!(L["SEDE"] && L["SEDE"].length)) {
    aviso("radAviso", "No pude cargar las listas de la hoja <b>Config</b>. Revisa que la fila de encabezados (SEDE, SERVICIO, EPS…) siga en su lugar.", "err");
  }
  $("leyendaTipos").innerHTML = TIPOS_ORDEN.map(tipoTag).join("");
  $("arranque").hidden = true;
  ver(APP.sesion.puede && APP.sesion.puede.admin ? "hub" : "inicio");   /* administradores: inicio general con los módulos; el resto entra directo a PQRS */
  if($("bloqueExcel")){   /* administradores: consolidado completo + indicadores; técnicos y consulta: solo indicadores (sin datos de casos) */
    var esAdm = !!(d.sesion && d.sesion.puede && d.sesion.puede.admin);
    $("btnExportarExcel").hidden = !esAdm;
    $("txtIndicadores").textContent = esAdm ? "Indicadores sin datos de casos (Excel)" : "Descargar indicadores (Excel)";
  }
  if(d.migracion && d.migracion.hecho) toast({ tipo:"area", titulo:"Consolidado actualizado", texto:d.migracion.mensaje, dur:12000 });
  else if(d.migracion && d.migracion.mensaje) toast({ tipo:"err", titulo:"Revisión pendiente", texto:d.migracion.mensaje, dur:12000 });
  srvSilencioso("apiPlantillas").then(function(pl){ APP.plantillas = pl || []; });
  if(CICLO) clearInterval(CICLO);
  CICLO = setInterval(sondear, 60000);
  abrirEnlaceDirecto();
  try { if(window.riverinoIniciar) window.riverinoIniciar(); } catch(e) {}
}
/* Enlace de los avisos: …/exec?pqrs=SIAU-2026-09-0001 abre ese radicado después de ingresar. */
function abrirEnlaceDirecto(){
  try {
    if(!(window.google && google.script && google.script.url)) return;
    google.script.url.getLocation(function(l){
      var c = l && l.parameter && l.parameter.pqrs;
      if(c && !APP.enlaceUsado && /^[A-Z]{2,6}-\d{4}-\d{2}-\d{3,}$/i.test(c)){ APP.enlaceUsado = true; abrirDetalle(String(c).toUpperCase()); }
    });
  } catch(e) {}
}
function entidadSede(){
  var ops = APP.listas["ENTIDAD PRESENTADA"] || [];
  for(var i=0;i<ops.length;i++) if(norm(ops[i]).indexOf("sede")===0) return ops[i];
  return ops[0] || "";
}
function valoresPorDefecto(){
  $("r_canal").value = "Presencial";
  $("r_entidad").value = entidadSede();
  $("r_fechaRecepcion").value = hoyISO();
  $("r_fechaRadicacion").value = hoyISO();
}
function cargarApp(){
  $("acceso").hidden = true; $("app").hidden = false;
  srv("appBootstrap").then(arrancar).catch(function(e){
    $("arranque").innerHTML = '<div class="aviso err">'+ic("alerta","s")+'<div>No pude conectar con el consolidado.<br>'+msgErr(e)+'</div></div>';
  });
}

/* ============================ avisos emergentes ============================ */
function toast(o){
  var el = document.createElement("div");
  var dur = o.dur || 8000;
  el.className = "toast " + (o.tipo||"");
  var icono = {correo:"correo", area:"area", err:"alerta", feliz:"estrella"}[o.tipo] || "radicar";
  el.innerHTML = '<div class="bola">'+ic(icono)+'</div><div><b>'+esc(o.titulo)+'</b><p>'+esc(o.texto||"")+'</p>'+
    (o.accion ? '<button class="ir" type="button">'+esc(o.accion)+ic("flecha","s")+'</button>' : '')+
    '</div><button class="x" type="button" aria-label="Cerrar">'+ic("x","s")+'</button>'+
    '<div class="tiempo" style="animation-duration:'+dur+'ms"></div>';
  $("toasts").appendChild(el);
  var quitar = function(){ if(!el.parentNode) return; el.style.transition="opacity .2s,transform .2s"; el.style.opacity="0"; el.style.transform="translateX(20px)";
    setTimeout(function(){ if(el.parentNode) el.parentNode.removeChild(el); }, 220); };
  var t = setTimeout(quitar, dur);
  el.querySelector(".x").addEventListener("click", function(){ clearTimeout(t); quitar(); });
  if(o.accion && o.alPulsar) el.querySelector(".ir").addEventListener("click", function(){ clearTimeout(t); quitar(); o.alPulsar(); });
  while($("toasts").children.length > 3) $("toasts").removeChild($("toasts").firstChild);
}
function notificar(n){
  n.hora = new Date(); n.nueva = true;
  sonar(n.prioridad); escritorio(n.titulo, n.texto);
  if(n.tipo === "feliz") celebrar();
  if(n.prioridad === "Vital") alarmaVisual();
  APP.notifs.unshift(n); APP.notifs = APP.notifs.slice(0,40);
  pintarCentro();
  toast({ tipo:n.tipo, titulo:n.titulo, texto:n.texto, accion:n.accion, alPulsar:n.ir });
}
function pintarCentro(){
  var nuevas = APP.notifs.filter(function(x){ return x.nueva; }).length;
  $("campanaN").hidden = !nuevas; $("campanaN").textContent = nuevas > 9 ? "9+" : nuevas;
  $("centroLista").innerHTML = APP.notifs.length ? APP.notifs.map(function(n,i){
    var icono = {correo:"correo", area:"area", err:"alerta", feliz:"estrella"}[n.tipo] || "radicar";
    return '<button class="nt'+(n.nueva?" nueva":"")+'" type="button" data-i="'+i+'"><div class="bola">'+ic(icono,"s")+'</div>'+
      '<div><b>'+esc(n.titulo)+'</b><span>'+esc(n.texto)+'</span><em>'+
      n.hora.toLocaleTimeString("es-CO",{hour:"2-digit",minute:"2-digit"})+'</em></div></button>';
  }).join("") : '<div class="vacio">Sin novedades en esta sesión.<br>Las PQRS que entren por el formulario o el correo aparecerán aquí.</div>';
  $("centroLista").querySelectorAll(".nt").forEach(function(b){
    b.addEventListener("click", function(){ var n=APP.notifs[parseInt(b.dataset.i,10)]; n.nueva=false; pintarCentro(); $("centro").hidden=true; if(n.ir) n.ir(); });
  });
}
$("btnCampana").addEventListener("click", function(e){ e.stopPropagation(); $("centro").hidden = !$("centro").hidden; });
$("btnLeidas").addEventListener("click", function(){ APP.notifs.forEach(function(n){ n.nueva=false; }); pintarCentro(); });
document.addEventListener("click", function(e){ if(!$("centro").hidden && !$("centro").contains(e.target)) $("centro").hidden = true; });

/* Consulta en segundo plano: PQRS nuevas cada minuto y el correo cada 3 minutos. */
function sondear(){
  if(!TOKEN) return;
  APP.ticks++;
  var conCorreo = (APP.ticks % 3 === 0);
  srvSilencioso("apiNovedades", APP.desde, conCorreo).then(function(r){
    if(!r) return;
    APP.desde = r.ahora || Date.now();
    (r.eventos||[]).forEach(function(ev){
      if(APP.propios[ev.codigo] && ev.accion==="Radicación") return;
      if(ev.alerta){
        var vital = /vital/i.test(ev.nivel||"") || /vital/i.test(ev.detalle||"");
        notificar({ tipo:"err", prioridad: vital ? "Vital" : "Crítica", titulo:(ev.accion==="Alerta de riesgo" ? (vital ? "Riesgo vital · " : "PQRS priorizada · ") : "Alerta de término · ")+ev.codigo,
          texto: ev.detalle || "Requiere gestión inmediata.", accion:"Gestionar", ir:function(){ abrirDetalle(ev.codigo); } });
            } else if(ev.ente){
        notificar({ tipo:"err", prioridad:"Ente", titulo:"Correo de un ente de control", texto: ev.detalle || "", accion:"Ir al correo", ir:function(){ APP.correosCargados=false; APP.correoCat="institucional"; ver("correo"); } });
      } else if(ev.accion==="Radicación" && ev.felicitacion){

          accion:"Abrir", ir:function(){ abrirDetalle(ev.codigo); } });

      }
    });
    if(r.correo && !r.correo.error){
      var rel = r.correo.relevantes || 0;

          accion:"Ir al correo", ir:function(){ APP.correosCargados=false; ver("correo"); } });
      }
      APP.correoPrevio = rel;
    }
    if(r.eventos && r.eventos.length && !$("v-inicio").hidden) cargarInicio(true);
  }).catch(function(){ /* sin conexión: se reintenta en el siguiente ciclo */ });
}

/* Coincidencia tolerante con las listas de Config («SUPERSALUD» = «SUPER SALUD», «Mutual Ser» ⊂ «MUTUAL SER EPS»). */
function igualLista(o, valor, ops){
  var c = function(x){ return norm(x).replace(/[^a-z0-9ñ]/g,""); }, a = c(o), v = c(valor);
  if(!v) return false;
  if(a===v) return true;
  for(var i=0;i<(ops||[]).length;i++) if(c(ops[i])===v) return false;   // hay una exacta: no adivinar
  var primera = (ops||[]).filter(function(x){ var k=c(x); return v.length>=4 && (k.indexOf(v)!==-1 || v.indexOf(k)!==-1 && k.length>=4); })[0];
  return primera===o;
}

      var claves = ordenarTipos(obj);

      return '<div class="barras-h">'+claves.map(function(k){

      var claves = Object.keys(obj||{}).sort(function(a,b){ return obj[b]-obj[a]; }).slice(0,n||6);

    $("modal").innerHTML =

            '<div><b style="color:var(--ok)">'+ag.cerradas+'</b><span>Cerradas</span></div><div><b style="color:var(--bad)">'+ag.vencidas+'</b><span>Vencidas</span></div></div>'+

  raiz.querySelectorAll("input[data-up]").forEach(function(inp){
    inp.addEventListener("change", function(){
      var clave = inp.dataset.up; APP.subidas[clave] = APP.subidas[clave] || [];
      var total = APP.subidas[clave].reduce(function(s,f){ return s+f.tam; },0);
      Array.prototype.forEach.call(inp.files, function(file){
        if(file.size > 10*1024*1024){ aviso("hiloAviso","«"+esc(file.name)+"» pesa más de 10 MB.","err"); return; }
        if(total + file.size > 18*1024*1024){ aviso("hiloAviso","Los archivos superan 18 MB en total.","err"); return; }
        total += file.size;
        var rd = new FileReader();
        rd.onload = function(){ APP.subidas[clave].push({ nombre:file.name, tipo:file.type||"application/octet-stream", tam:file.size, base64:String(rd.result).split(",")[1]||"" }); pintarSubidos(clave); };
        rd.readAsDataURL(file);
      });
      inp.value = "";
    });
  });
}

        '<div><label>Fecha de recepción</label><input type="date" id="x_fec" value="'+esc(it.fechaISO||hoyISO())+'"></div>'+
        '<div class="full"><label class="req">Descripción (se radica este texto)</label><textarea id="x_desc" style="min-height:120px">'+esc((h.asunto?h.asunto+"\n\n":"")+txtUsuario)+'</textarea></div>'+
        '<div class="full"><label>Observaciones internas</label><input id="x_obs"></div>'+
        '<label class="chk full"><input type="checkbox" id="x_adj" checked> Guardar los adjuntos del usuario en Drive y enlazarlos al radicado</label>'+
      '</div>'+
      '<div class="acciones"><button class="b pri" type="button" id="btnHRadicar">'+ic("check","s")+'Radicar PQRS</button>'+
        '<span class="hint">¿Faltan datos? Usa «Pedir datos» y radica cuando el usuario responda.</span></div>';

  var areas = APP.responsables.filter(function(r){ return r.activo; }).slice().sort(function(a,b){
    var ca = /cita|agend|call|admision/i.test(a.area) ? 0 : 1, cb = /cita|agend|call|admision/i.test(b.area) ? 0 : 1;
    return esCita ? ca-cb : 0;
  });
  var preArea = esCita ? (areas.filter(function(r){ return r.correo && /cita|agend|call/i.test(r.area); })[0]||{}).id : "";
  var opcAreas = areas.map(function(r){ var falta=!r.correo;
    return '<option value="'+esc(r.id)+'"'+(falta?" disabled":"")+(String(r.id)===String(preArea)?" selected":"")+'>'+esc(r.area)+(r.nombre?" · "+esc(r.nombre):"")+(falta?"  (sin correo)":"")+'</option>'; }).join("");

  var tabs = [["radicar","Radicar PQRS","radicar"],["datos","Pedir datos","usuario"],["dir","Direccionar","enviar"],["resp","Responder","responder"]];
  var tabIni = APP.tabHilo || (h.codigo ? "resp" : (esCita ? "dir" : "radicar")); APP.tabHilo = null;
  setTimeout(function(){ if($("x_cat")) $("x_cat").addEventListener("change", function(){ var o=this.options[this.selectedIndex]; if(o && o.dataset.tipo){ var t=$("x_tipo"); for(var i=0;i<t.options.length;i++) if(norm(t.options[i].value)===norm(o.dataset.tipo)) t.selectedIndex=i; } }); }, 0);

  $("vistaHilo").innerHTML =
    '<button class="b fant" type="button" id="btnVolverCorreo" style="margin-bottom:10px">'+ic("atras","s")+'Volver al correo</button>'+
    '<div class="card anim"><div class="hilo-cab"><div class="bola '+it.categoria+'">'+ic(cat.i)+'</div><div style="min-width:0">'+
      '<h3>'+esc(h.asunto||"(sin asunto)")+'</h3><div class="claves" style="margin-top:6px"><span class="clave est">'+esc(cat.t)+'</span>'+
      (info.estado?'<span class="clave est">'+esc(info.estado)+'</span>':'')+(h.codigo?'<span class="clave cod">'+esc(h.codigo)+'</span>':'')+
      '<span class="clave gris">'+h.mensajes.length+' mensaje(s)</span>'+(todosAdjuntos().length?'<span class="clave gris">'+todosAdjuntos().length+' adjunto(s)</span>':'')+'</div></div>'+
      '<div class="hilo-acc"><button class="b sec mini" type="button" id="btnHAtendida">'+ic("check","s")+'Marcar atendida</button>'+
      (h.codigo?'':'<button class="b fant mini" type="button" id="btnHDescartar">No es PQRS ni cita</button>')+'</div></div>'+
      '<div id="hiloAviso"></div>'+(h.analisis ? htmlAnalisis(h.analisis) : '')+
      '<div class="hilo-cols"><div><p class="sub-tit">Conversación</p><div class="mensajes">'+mensajes+'</div></div>'+
      '<div><div class="tabs-acc">'+tabs.map(function(t){ return '<button type="button" data-tab="'+t[0]+'" class="'+(t[0]===tabIni?"on":"")+'">'+ic(t[2],"s")+t[1]+'</button>'; }).join("")+'</div>'+
        '<div class="panel" data-panel="radicar"'+(tabIni==="radicar"?"":" hidden")+'><h4>'+ic("radicar","s")+'Radicar como PQRS</h4>'+
          '<p class="d">Los datos marcados «del correo» se leyeron de los mensajes del usuario: revísalos antes de radicar.</p>'+formRadicar+'</div>'+
        '<div class="panel" data-panel="datos"'+(tabIni==="datos"?"":" hidden")+'><h4>'+ic("usuario","s")+'Pedir datos o documentos al usuario</h4>'+
          '<p class="d">Se responde en esta misma conversación. Cuando el usuario conteste, aparece en «En conversación».</p>'+
          '<div class="lista-chk">'+DATOS_PEDIR.map(function(x,i){ return '<label class="chk"><input type="checkbox" data-pedir="'+i+'"'+(faltan[x]?" checked":"")+'> '+esc(x)+'</label>'; }).join("")+'</div>'+
          '<label style="margin-top:10px">Otro dato o documento</label><input id="x_otro" placeholder="Ej.: foto de la orden de laboratorio">'+
          '<label style="margin-top:10px">Mensaje (opcional)</label><textarea id="x_msgDatos" placeholder="Si lo dejas vacío se usa el saludo estándar."></textarea>'+
          selectorAdjuntos("datos", false)+
          '<div class="acciones"><button class="b pri" type="button" id="btnHDatos">'+ic("enviar","s")+'Enviar solicitud al usuario</button></div></div>'+
        '<div class="panel" data-panel="dir"'+(tabIni==="dir"?"":" hidden")+'><h4>'+ic("enviar","s")+(esCita?'Direccionar la solicitud de cita':'Direccionar a un área')+'</h4>'+
          '<label>Área</label><select id="x_area"><option value="">— Seleccionar —</option>'+opcAreas+'</select>'+
          (esCita && !areas.some(function(r){ return /cita|agend|call/i.test(r.area); }) ? '<div class="hint">No hay un área de citas en Responsables: agrégala (p. ej. «ASIGNACIÓN DE CITAS») con su correo.</div>' : '')+
          '<div class="modos">'+
            '<label class="modo"><input type="radio" name="x_modo" value="reenviar" checked><div><b>Reenviar al área</b><span>Interno: el usuario no lo ve. La respuesta del área vuelve a esta conversación.</span></div></label>'+
            '<label class="modo"><input type="radio" name="x_modo" value="copia"><div><b>Responder con el área en copia</b><span>Usuario, área y SIAU conversan en el mismo hilo.</span></div></label>'+
          '</div>'+
          '<label class="chk"><input type="checkbox" id="x_avisar" checked> Avisar al usuario que su solicitud fue remitida (solo al reenviar)</label>'+
          '<label style="margin-top:10px">Indicaciones para el área</label><textarea id="x_nota" placeholder="'+(esCita?"Ej.: agendar consulta de ortopedia en la sede indicada":"Qué se necesita del área")+'"></textarea>'+
          selectorAdjuntos("dir", false)+
          '<div class="hint">Al reenviar, los adjuntos del último mensaje del usuario viajan siempre con el correo.</div>'+
          '<div class="acciones"><button class="b pri" type="button" id="btnHDir">'+ic("enviar","s")+'Direccionar</button></div></div>'+
        '<div class="panel" data-panel="resp"'+(tabIni==="resp"?"":" hidden")+'><h4>'+ic("responder","s")+'Responder al usuario</h4>'+
          '<textarea id="x_resp" style="min-height:120px" placeholder="Mensaje para el usuario…"></textarea>'+
          (info.correoArea?'<label class="chk"><input type="checkbox" id="x_ccArea"> Copiar a '+esc(info.area)+'</label>':'')+
          '<label class="chk"><input type="checkbox" id="x_cerrar"> Dar la conversación por atendida al enviar</label>'+
          selectorAdjuntos("resp", false)+
          '<div class="acciones"><button class="b pri" type="button" id="btnHResp">'+ic("enviar","s")+'Enviar al usuario</button></div>'+
          (info.correoArea ? '<div class="sep"></div><h4>'+ic("area","s")+'Escribir a '+esc(info.area)+'</h4><p class="d">Seguimiento interno en la misma conversación (el usuario no lo ve).</p>'+
            '<textarea id="x_msgArea" placeholder="Ej.: ¿ya tienen fecha para la cita?"></textarea>'+selectorAdjuntos("area", false)+
            '<div class="acciones"><button class="b sec" type="button" id="btnHArea">'+ic("enviar","s")+'Enviar al área</button></div>' : '')+
        '</div>'+
      '</div></div></div>';

  var v = $("vistaHilo");
  activarSubidas(v);
  $("btnVolverCorreo").addEventListener("click", volverALista);
  v.querySelectorAll("[data-tab]").forEach(function(b){
    b.addEventListener("click", function(){
      v.querySelectorAll("[data-tab]").forEach(function(x){ x.classList.toggle("on", x===b); });
      v.querySelectorAll("[data-panel]").forEach(function(p){ p.hidden = p.dataset.panel!==b.dataset.tab; });
    });
  });
  v.querySelectorAll("[data-ver]").forEach(function(b){ b.addEventListener("click", function(){ var p=b.dataset.ver.split(":"); verAdjunto(p[0], parseInt(p[1],10)); }); });
  v.querySelectorAll("[data-drive]").forEach(function(b){ b.addEventListener("click", function(){ var p=b.dataset.drive.split(":"); guardarDrive(p[0], parseInt(p[1],10), b); }); });
  v.querySelectorAll("[data-reg-area]").forEach(function(b){ b.addEventListener("click", function(){ registrarRespuestaHilo(b.dataset.regArea, b); }); });
  v.querySelectorAll("[data-anotar]").forEach(function(b){ b.addEventListener("click", function(){ anotarHilo(b.dataset.anotar, b); }); });
  if($("lnkRad")) $("lnkRad").addEventListener("click", function(e){ e.preventDefault(); abrirDetalle(h.codigo); });
  if($("btnHRadicar")) $("btnHRadicar").addEventListener("click", radicarDesdeHilo);
  $("btnHDatos").addEventListener("click", pedirDatos);
  $("btnHDir").addEventListener("click", direccionarHilo);
  $("btnHResp").addEventListener("click", responderHilo);
  if($("btnHArea")) $("btnHArea").addEventListener("click", escribirArea);
  $("btnHAtendida").addEventListener("click", function(){ cerrarHilo(this); });
  if($("btnHDescartar")) $("btnHDescartar").addEventListener("click", function(){ descartarHilo(this); });
}

/* ---------- acciones ---------- */
function trasAccion(fin, okTexto, sacar){
  return function(r){
    fin();
    if(!r || r.ok===false){ aviso("hiloAviso", esc(r && r.mensaje || "No se pudo completar."), "err"); window.scrollTo({top:0,behavior:"smooth"}); return; }
    toast({ tipo:"area", titulo:okTexto, texto:r.mensaje||"", dur:6000 });
    if(sacar){ quitarDeLista(APP.item.hiloId); volverALista(); }
    else { APP.item.categoria = APP.item.categoria==="cita" ? "cita" : "curso"; recargarHilo(); }
  };
}
function falloHilo(fin){ return function(e){ fin(); aviso("hiloAviso", msgErr(e), "err"); }; }

function radicarDesdeHilo(){
  var it = APP.item, h = APP.hilo;
  var ultimoUsr = h.mensajes.filter(function(m){ return m.rol==="usuario"; }).pop();
  var d = { tipoPqrs:val("x_tipo"), entidad:val("x_ent"), sede:val("x_sede"), servicio:val("x_serv"), tipoDocSolicitante:val("x_tdoc"),
    numDocSolicitante:val("x_ndoc"), nombreSolicitante:val("x_nom"), telefono:val("x_tel"), correo:val("x_cor"), eps:val("x_eps"),
    regimen:val("x_reg"), fechaRecepcion:val("x_fec"), descripcion:val("x_desc"), observaciones:val("x_obs"),
    tipoSolicitante:"Usuario", guardarAdjuntos:$("x_adj").checked,
    clasificacion: $("x_cat") ? val("x_cat") : "" };
  if(h.entidad){ d.observaciones = ("Remitente institucional: "+h.entidad.nombre+" ("+h.entidad.tipo+") "+(d.observaciones||"")).trim(); }
  if(!d.tipoPqrs){ aviso("hiloAviso","Indica el tipo de PQRS.","err"); return; }
  var fin = ocupado("btnHRadicar","Radicando…");
  srv("apiRadicarCorreo", ultimoUsr ? ultimoUsr.id : it.id, d).then(function(r){
    fin();
    if(!r.ok){ aviso("hiloAviso", esc(r.mensaje), "err"); return; }
    APP.propios[r.codigo] = true;
    toast({ tipo:"area", titulo:"Radicada como "+r.codigo, texto:"Acuse: "+r.acuse+(r.adjuntos?" · adjuntos: "+r.adjuntos:""), accion:"Abrir radicado", alPulsar:function(){ abrirDetalle(r.codigo); }, dur:9000 });
    quitarDeLista(it.hiloId); volverALista();
  }).catch(falloHilo(fin));
}
function pedirDatos(){
  var items = [];
  document.querySelectorAll("input[data-pedir]:checked").forEach(function(c){ items.push(DATOS_PEDIR[parseInt(c.dataset.pedir,10)]); });
  if(val("x_otro")) items.push(val("x_otro"));
  if(!items.length && !val("x_msgDatos")){ aviso("hiloAviso","Marca al menos un dato o documento.","err"); return; }
  var o = leerSeleccion("datos"); o.items = items; o.mensaje = val("x_msgDatos"); o.categoria = APP.item.categoria==="cita"?"cita":"pqrs";
  var fin = ocupado("btnHDatos","Enviando…");
  srv("apiSolicitarDatos", APP.item.hiloId, o).then(trasAccion(fin,"Datos solicitados al usuario")).catch(falloHilo(fin));
}
function direccionarHilo(){
  var id = val("x_area"); if(!id){ aviso("hiloAviso","Elige el área.","err"); return; }
  var modo = (document.querySelector('input[name="x_modo"]:checked')||{}).value || "reenviar";
  var o = leerSeleccion("dir"); o.idResponsable = id; o.modo = modo; o.nota = val("x_nota"); o.avisarUsuario = $("x_avisar").checked;
  o.categoria = APP.item.categoria==="cita" || (APP.hilo.info||{}).categoria==="cita" ? "cita" : "pqrs";
  var fin = ocupado("btnHDir","Enviando…");
  srv("apiDireccionarHilo", APP.item.hiloId, o).then(trasAccion(fin,"Conversación direccionada")).catch(falloHilo(fin));
}
function responderHilo(){
  if(!val("x_resp")){ aviso("hiloAviso","Escribe el mensaje.","err"); return; }
  var o = leerSeleccion("resp"); o.mensaje = val("x_resp"); o.copiaArea = $("x_ccArea") ? $("x_ccArea").checked : false; o.cerrar = $("x_cerrar").checked;
  var fin = ocupado("btnHResp","Enviando…");
  srv("apiResponderHilo", APP.item.hiloId, o).then(trasAccion(fin,"Mensaje enviado al usuario", o.cerrar)).catch(falloHilo(fin));
}
function escribirArea(){
  if(!val("x_msgArea")){ aviso("hiloAviso","Escribe el mensaje para el área.","err"); return; }
  var o = leerSeleccion("area"); o.mensaje = val("x_msgArea");
  var fin = ocupado("btnHArea","Enviando…");
  srv("apiEscribirArea", APP.item.hiloId, o).then(trasAccion(fin,"Mensaje enviado al área")).catch(falloHilo(fin));
}
function cerrarHilo(b){
  var fin = ocupado(b,"Guardando…");
  srv("apiCerrarHilo", APP.item.hiloId, "").then(trasAccion(fin,"Conversación atendida", true)).catch(falloHilo(fin));
}
function descartarHilo(b){
  var fin = ocupado(b,"Marcando…");
  srv("apiDescartarCorreo", APP.item.id, "").then(trasAccion(fin,"Marcado como «no es PQRS»", true)).catch(falloHilo(fin));
}
function registrarRespuestaHilo(msgId, b){
  var fin = ocupado(b,"Registrando…");
  srv("apiRegistrarRespuestaDesdeCorreo", msgId, APP.hilo.codigo, "").then(function(r){
    fin();
    if(!r.ok){ aviso("hiloAviso", esc(r.mensaje), "err"); return; }
    toast({ tipo:"area", titulo:"Respuesta del área registrada", texto:r.codigo+" ya aparece en «Por responder».", accion:"Abrir radicado", alPulsar:function(){ abrirDetalle(r.codigo); } });
    recargarHilo();
  }).catch(falloHilo(fin));
}
function anotarHilo(msgId, b){
  var fin = ocupado(b,"Anotando…");
  srv("apiMarcarCorreoAtendido", msgId, APP.hilo.codigo||"", "").then(function(r){
    fin(); if(!r.ok){ aviso("hiloAviso", esc(r.mensaje), "err"); return; }
    toast({ tipo:"area", titulo:"Anotado en la trazabilidad", texto:APP.hilo.codigo }); recargarHilo();
  }).catch(falloHilo(fin));
}

/* ---------- visor de documentos ---------- */
var URL_VISTA = null;
function verAdjunto(msgId, idx){
  $("modal").innerHTML = '<div class="velo" id="velo"><div class="modal visor"><div class="modal-cab"><div><h3>Abriendo documento…</h3></div>'+
    '<button class="cerrar" type="button" id="btnCerrarModal">'+ic("x")+'</button></div><div class="modal-cuerpo"><div class="sk" style="height:420px"></div></div></div></div>';
  $("modal").hidden = false;
  $("btnCerrarModal").addEventListener("click", cerrarModal);
  srv("apiAdjunto", msgId, idx).then(function(a){
    if(!a.ok){ $("modal").querySelector(".modal-cuerpo").innerHTML = '<div class="aviso err">'+ic("alerta","s")+'<div>'+esc(a.mensaje)+'</div></div>'+
      '<div class="acciones"><button class="b pri" type="button" id="btnVDrive">Guardar en Drive</button></div>';
      $("btnVDrive").addEventListener("click", function(){ guardarDrive(msgId, idx, this); }); return; }
    var bytes = atob(a.base64), arr = new Uint8Array(bytes.length);
    for(var i=0;i<bytes.length;i++) arr[i] = bytes.charCodeAt(i);
    if(URL_VISTA) URL.revokeObjectURL(URL_VISTA);
    URL_VISTA = URL.createObjectURL(new Blob([arr], { type:a.tipo }));
    var cuerpo;
    if(a.tipo.indexOf("image/")===0) cuerpo = '<img class="vista-img" src="'+URL_VISTA+'" alt="'+esc(a.nombre)+'">';
    else if(a.tipo.indexOf("pdf")!==-1) cuerpo = '<iframe class="vista-pdf" src="'+URL_VISTA+'" title="'+esc(a.nombre)+'"></iframe>';
    else if(/^text\//.test(a.tipo)) cuerpo = '<pre class="vista-txt">'+esc(new TextDecoder().decode(arr))+'</pre>';
    else cuerpo = vacio("archivo","Este tipo de archivo no se puede mostrar aquí. Descárgalo o guárdalo en Drive.");
    $("modal").querySelector(".modal").innerHTML = '<div class="modal-cab"><div><h3>'+esc(a.nombre)+'</h3><p>'+esc(a.tipo)+' · '+tamano(a.tam)+'</p></div>'+
      '<div class="hilo-acc"><a class="b sec mini" href="'+URL_VISTA+'" download="'+esc(a.nombre)+'">'+ic("baja","s")+'Descargar</a>'+
      '<button class="b sec mini" type="button" id="btnVDrive">Guardar en Drive</button>'+
      '<button class="cerrar" type="button" id="btnCerrarModal2">'+ic("x")+'</button></div></div><div class="modal-cuerpo">'+cuerpo+'</div>';
    $("btnCerrarModal2").addEventListener("click", cerrarModal);
    $("btnVDrive").addEventListener("click", function(){ guardarDrive(msgId, idx, this); });
  }).catch(function(e){ $("modal").querySelector(".modal-cuerpo").innerHTML = '<div class="aviso err">'+ic("alerta","s")+'<div>'+msgErr(e)+'</div></div>'; });
  $("velo").addEventListener("click", function(e){ if(e.target.id==="velo") cerrarModal(); });
}
function guardarDrive(msgId, idx, b){
  var fin = ocupado(b,"Guardando…");
  srv("apiGuardarAdjuntoDrive", msgId, idx, APP.hilo ? APP.hilo.codigo||"" : "").then(function(r){
    fin();
    if(!r.ok){ toast({ tipo:"err", titulo:"No se pudo guardar", texto:r.mensaje }); return; }
    toast({ tipo:"area", titulo:"Guardado en Drive", texto:r.nombre, accion:"Abrir en Drive", alPulsar:function(){ window.open(r.url, "_blank"); } });
  }).catch(function(e){ fin(); toast({ tipo:"err", titulo:"No se pudo guardar", texto:msgErr(e) }); });
}
</script>
