<script>
/* Textos largos (descripción y respuestas): se muestran recortados con «Ver completo». */
function plegarBloques(raiz){
  (raiz||document).querySelectorAll(".bloque.plegable").forEach(function(b){
    if(b.dataset.plegado) return; b.dataset.plegado = "1";
    if(b.scrollHeight <= 230) return;
    b.classList.add("cerrado");
    var btn = document.createElement("button"); btn.type = "button"; btn.className = "ver-mas"; btn.textContent = "Ver completo";
    btn.addEventListener("click", function(){ var c = b.classList.toggle("cerrado"); btn.textContent = c ? "Ver completo" : "Ver menos"; });
    b.parentNode.insertBefore(btn, b.nextSibling);
  });
}
/* ============================ DETALLE ============================ */
function abrirDetalle(codigo){
  cerrarModal();
  ver("detalle");
  $("detalleCuerpo").innerHTML = '<div class="card"><div class="sk" style="height:34px;width:260px;margin-bottom:14px"></div>'+esqueleto(5)+'</div>';
  srv("apiDetalle", codigo).then(pintarDetalle).catch(function(e){
    $("detalleCuerpo").innerHTML = '<div class="aviso err">'+ic("alerta","s")+'<div>'+msgErr(e)+'</div></div>';
  });
}
$("btnVolver").addEventListener("click", function(){ ver("bandeja"); cargarBandeja(); });

function opcionesAreas(sel){
  return APP.responsables.filter(function(r){ return r.activo; }).map(function(r){
    var falta = !r.correo;
    return '<option value="'+esc(r.id)+'"'+(String(sel)===String(r.id)?" selected":"")+(falta?" disabled":"")+'>'+
      esc(r.area)+(r.nombre?" · "+esc(r.nombre):"")+(falta?"  (sin correo)":"")+'</option>';
  }).join("");
}

function pintarDetalle(d){
  if(!d.ok){ $("detalleCuerpo").innerHTML = '<div class="aviso err">'+ic("alerta","s")+'<div>'+esc(d.mensaje)+'</div></div>'; return; }
  APP.detalle = d;
  var cerrada = norm(d.estado).indexOf("cerrada")!==-1;
  var conArea = !!d.correoResponsable;
  var terminoOk = typeof d.termino === "number" || d.termino === "N/A";

  var ficha = function(pares){
    return '<div class="ficha">'+pares.filter(function(p){ return p[1]!==""&&p[1]!==null&&p[1]!==undefined; }).map(function(p){
      return '<div><span>'+esc(p[0])+'</span><span'+(p[2]?' class="alerta"':'')+'>'+esc(p[1])+'</span></div>'; }).join("")+'</div>';
  };

  var acciones = "";
  var puede = (APP.sesion && APP.sesion.puede) || {gestion:true, correo:true, radicar:true};
  var feli = !!d.esFelicitacion;
  var sug = d.areasSugeridas || [];
  if(!puede.gestion){
    var paso = function(ok, t, d){ return '<div class="paso'+(ok?" ok":"")+'"><i>'+(ok?ic("check","s"):"")+'</i><div><b>'+t+'</b><span>'+esc(d||"Pendiente")+'</span></div></div>'; };
    acciones += '<div class="panel"><h4>'+ic("pulso","s")+'Seguimiento de la gestión</h4>'+
      '<p class="d">'+(puede.radicar ? 'Tú radicas y consultas. El direccionamiento a las áreas y la respuesta al usuario las hace el administrador del SIAU.'
        : 'Tu rol permite ver el caso y su trazabilidad.')+'</p>'+
      '<div class="pasos">'+paso(true, "Radicada", d.fechaRadicacion)+
        paso(!!d.responsable, feli ? "Entregada al área" : "Direccionada al área", d.responsable ? d.responsable : (feli ? "Se entrega al área en el resumen diario de reconocimientos" : "El administrador la enviará al área responsable"))+
        (feli ? '' : paso(!!d.respuestaArea, "Gestión del área", d.fechaRespuestaArea ? "Respondió el "+d.fechaRespuestaArea : "")+
        paso(cerrada, "Respuesta al usuario", cerrada ? "Enviada el "+(d.fechaRespuestaUsuario||"") : (d.limiteHoras ? "Límite "+d.limiteHoras : (d.fechaMax ? "Vence el "+d.fechaMax : ""))))+'</div></div>';
  } else if(!cerrada && feli){
    acciones += '<div class="panel feliz-panel"><h4>'+ic("estrella","s")+'Entregar la felicitación al área</h4>'+
      '<p class="d">El usuario ya recibió el agradecimiento. Al entregarla, el área recibe el reconocimiento y la felicitación queda cerrada (no requiere respuesta ni seguimiento).</p>'+
      sugerenciasArea(sug)+
      '<div class="grid"><div class="full"><label for="selArea">Área que recibe el reconocimiento</label>'+
        '<select id="selArea"><option value="">— Seleccionar —</option>'+opcionesAreas(sug.length ? sug[0].id : null)+'</select></div>'+
      '<div class="full"><label for="notaArea">Nota para el área (opcional)</label><input id="notaArea" placeholder="Ej.: menciona a la jefe de enfermería del turno de la noche"></div></div>'+
      '<div class="acciones"><button class="b pri" id="btnEnviarArea" type="button">'+ic("estrella","s")+'Entregar y cerrar</button></div></div>';
  } else if(!cerrada){
    acciones += '<div class="panel"><h4>'+ic("enviar","s")+(conArea?"Redireccionar a otra área":"Direccionar al área responsable")+'</h4>'+
      '<p class="d">'+(conArea
        ? "Si se envió al área equivocada, elige la correcta: se le notifica y el área anterior queda informada."
        : "El área recibe la solicitud interna y el usuario, en un correo aparte, el aviso de que su caso está en trámite.")+'</p>'+
      (conArea ? '' : sugerenciasArea(sug))+
      '<div class="grid"><div class="full"><label for="selArea">Área responsable</label>'+
        '<select id="selArea"><option value="">— Seleccionar —</option>'+opcionesAreas(!conArea && sug.length ? sug[0].id : null)+'</select></div>'+
      '<div class="full"><label for="notaArea">'+(conArea?"Motivo del redireccionamiento":"Indicaciones para el área (opcional)")+'</label>'+
        '<input id="notaArea" placeholder="'+(conArea?"Ej.: corresponde a facturación, no a urgencias":"Indicación para quien gestiona")+'"></div></div>'+
      '<div class="acciones"><button class="b pri" id="btnEnviarArea" type="button">'+ic("enviar","s")+
        (conArea?"Redireccionar":"Enviar al área y avisar al usuario")+'</button>'+
        (conArea?'<button class="b sec" id="btnReenviarArea" type="button">Reenviar al área actual</button>':"")+
      '</div></div>';

    acciones += '<div class="panel"><h4>'+ic("area","s")+'Respuesta del área</h4>'+
      '<p class="d">Si el área respondió por correo, también puedes registrarla desde el módulo Correo con un clic.</p>'+
      '<div class="grid"><div class="full"><textarea id="txtRtaArea" placeholder="Gestión realizada por el área…">'+esc(d.respuestaArea||"")+'</textarea></div>'+
      '<div><label for="fRtaArea">Fecha de la respuesta</label><input type="date" id="fRtaArea"></div></div>'+
      '<div class="acciones"><button class="b sec" id="btnGuardarRtaArea" type="button">'+ic("check","s")+'Guardar respuesta del área</button></div></div>';

    acciones += '<div class="panel"><h4>'+ic("responder","s")+'Responder al usuario y cerrar</h4>'+
      '<p class="d">Parte de una plantilla o escribe la respuesta. Al enviarla, la PQRS queda cerrada.</p>'+
      '<label for="selPlantilla">Plantilla de respuesta</label>'+
      '<select id="selPlantilla"><option value="">— Escribir desde cero —</option>'+
        APP.plantillas.map(function(pl,i){
          return '<option value="'+i+'">'+esc(pl.codigo ? pl.codigo+" · "+pl.tipologia : pl.tipologia)+'</option>';
        }).join("")+'</select>'+
      '<div class="hint" style="margin-bottom:10px">Al elegirla se inserta el texto y puedes ajustarlo antes de enviar.</div>'+
      '<textarea id="txtRtaUsuario" placeholder="Respuesta final para el usuario…">'+esc(d.respuestaUsuario||"")+'</textarea>'+
      '<div class="acciones"><button class="b pri" id="btnResponder" type="button">'+ic("enviar","s")+'Enviar respuesta y cerrar</button>'+
      '<button class="b sec mini" id="btnRedactar" type="button" title="Convierte la gestión del área (o tu borrador) en una respuesta institucional">'+ic("varita","s")+'Redactar respuesta formal</button>'+
      '<button class="b sec mini" id="btnUsarGestion" type="button">Traer la gestión del área</button>'+
      '<button class="b fant mini" id="btnNuevaPlantilla" type="button">Guardar como plantilla</button>'+
      (d.correo?'':'<span class="chip a">El usuario no dejó correo: se guardará para entrega física</span>')+'</div></div>';
  } else {
    acciones += '<div class="panel"><h4>'+ic("check","s")+'PQRS cerrada</h4><p class="d">Respondida el '+esc(d.fechaRespuestaUsuario||"—")+
      '. '+(d.oportunidad?("Cumplimiento: <b>"+esc(d.oportunidad)+"</b>."):"")+'</p>'+
      '<div class="acciones"><button class="b sec" id="btnReenviarUsuario" type="button">Reenviar la respuesta al usuario</button></div></div>';
  }

  var notif = d.notificaciones || {};
  $("detalleCuerpo").innerHTML =
    '<div class="card anim"><div class="det-head"><div style="flex:1;min-width:230px">'+
      '<div class="cod">'+esc(d.codigo)+'</div>'+
      '<div class="chips">'+chip(d.semaforo)+'<span class="chip c sin">'+esc(d.estado)+'</span>'+tipoTag(d.tipoPqrs)+
        '<span class="chip c sin">'+esc(d.canal||"")+'</span>'+
        (d.redirecciones?'<span class="chip a">Redireccionada '+esc(d.redirecciones)+' vez/veces</span>':'')+
        (d.prioridad && d.prioridad!=="Normal"?'<span class="prio '+esc(d.prioridad)+'">Prioridad '+esc(d.prioridad)+'</span>':'')+
        (d.clasificacionInterna?'<span class="ent">'+esc(d.clasificacionInterna)+'</span>':'')+'</div>'+
    '</div>'+
    '<div class="hilo-acc">'+(d.hiloId && puede.correo ? '<button class="b sec mini" type="button" id="btnVerHilo">'+ic("correo","s")+'Ver conversación del correo</button>' : '')+'</div>'+
    '</div>'+
    (d.analisis ? htmlAnalisis(d.analisis) : '')+
    bandaRiesgo(d, puede, cerrada)+
    (d.etiquetas && d.etiquetas.sugerido && puede.radicar ? '<div class="banda-sug">'+ic("alerta","s")+'<div style="flex:1">Por lo que dice el texto, esta PQRS parece una <b>'+esc(d.etiquetas.sugerido)+'</b> y está registrada como <b>'+esc(d.tipoPqrs||"sin tipo")+'</b>.</div>'+
      '<button class="b pri mini" type="button" id="btnReclasificar" data-tipo="'+esc(d.etiquetas.sugerido)+'">Cambiar a '+esc(d.etiquetas.sugerido)+'</button>'+
      '<button class="b fant mini" type="button" id="btnMantener">Mantener</button></div>' : '')+
    (d.etiquetas && d.etiquetas.reclasificada ? '<div class="banda-sug" style="background:var(--star-wash);border-color:#BFE5CE">'+ic("check","s")+'<div>Reclasificada automáticamente por su contenido: <b>'+esc(d.etiquetas.reclasificada)+'</b>. Puedes cambiarla editando el tipo si no corresponde.</div></div>' : '')+
    (d.etiquetas && d.etiquetas.datosFaltantes ? '<div class="banda-sug" style="background:var(--bad-wash);border-color:#F1C4CD">'+ic("usuario","s")+'<div style="flex:1">Radicada sin: <b>'+esc(d.etiquetas.datosFaltantes)+'</b>.</div>'+
      (d.hiloId && puede.correo ? '<button class="b pri mini" type="button" id="btnPedirDatos">Pedir los datos al usuario</button>' : '')+'</div>' : '')+
    '<div id="detAviso"></div>'+
    '<div class="det-cols"><div>'+
      ficha([
        ["Solicitante", d.nombreSolicitante], ["Documento", ((d.tipoDocSolicitante||"")+" "+(d.numDocSolicitante||"")).trim()],
        ["Teléfono", d.telefono], ["Correo", d.correo], ["Dirección", d.direccion],
        ["Paciente / afiliado", d.nombreAfiliado], ["EPS", d.eps], ["Régimen", d.regimen],
        ["Sede", d.sede], ["Servicio", d.servicio], ["Servicio específico", d.servicioEspecifico],
        ["Fecha de los hechos", d.fechaPqrs], ["Fecha de recepción", d.fechaRecepcion + (d.recepcionHora && d.canal && /correo/i.test(d.canal) ? " (" + d.recepcionHora.split(" ")[1] + ")" : "")], ["Fecha de radicación", d.fechaRadicacion],
        ["Entidad presentada", d.entidad],
        ["Término", d.terminoTexto || (terminoOk ? d.termino : "Revisar la entidad presentada"), !terminoOk && !feli],
        ["Norma del término", d.normaTermino || ""],
        ["Vence", d.limiteHoras ? d.limiteHoras : d.fechaMax, !!d.limiteHoras],
        ["Nivel de riesgo", d.nivelRiesgo || ""], ["Población priorizada", (d.poblacionPriorizada||[]).join(", ")],
        ["Autorización de datos", d.autorizacionDatos || ""], ["Días transcurridos", dias(d.dias)!=="" ? dias(d.dias)+(dias(d.dias)===1?" día":" días") : ""],
        ["Área responsable", d.responsable], ["Correo del área", d.correoResponsable],
        ["Radicada por", d.registradoPor],
        ["Notificaciones", [notif.recepcion?"recepción "+notif.recepcion:"", notif.area?"área "+notif.area:"",
                            notif.gestion?"trámite "+notif.gestion:"", notif.cierre?"cierre "+notif.cierre:""].filter(String).join(" · ")],
      ])+
      '<div style="margin-top:14px"><label>Descripción</label><div class="bloque plegable">'+esc(d.descripcion||"—")+'</div></div>'+
      (d.respuestaArea?'<div style="margin-top:12px"><label>Respuesta del área ('+esc(d.fechaRespuestaArea||"")+')</label><div class="bloque area plegable">'+esc(d.respuestaArea)+'</div></div>':'')+
      (d.respuestaUsuario?'<div style="margin-top:12px"><label>Respuesta enviada al usuario ('+esc(d.fechaRespuestaUsuario||"")+')</label><div class="bloque rta plegable">'+esc(d.respuestaUsuario)+'</div></div>':'')+
    '</div><div class="det-lado">'+ acciones +
      '<div class="panel"><h4>'+ic("pulso","s")+'Trazabilidad</h4><div class="traza">'+
        (d.traza && d.traza.length ? d.traza.map(function(t){
          return '<div><b>'+esc(t.accion)+'</b><em>'+esc(t.fecha)+' · '+esc(t.usuario)+'</em><p>'+esc(t.detalle||"")+'</p></div>';
        }).join("") : '<div><em>Sin movimientos registrados.</em></div>')+
      '</div></div>'+
    '</div></div></div>';

  plegarBloques($("detalleCuerpo"));
  var cols = document.querySelector("#detalleCuerpo .det-cols");
  if(cols && cols.children[1] && window.innerWidth > 900){
    var izq = cols.children[0].offsetHeight, der = cols.children[1].offsetHeight;
    if(izq > der + 120 && der < window.innerHeight - 110) cols.children[1].classList.add("fijo");
  }
  if($("fRtaArea")) $("fRtaArea").value = hoyISO();
  var abrirHiloDe = function(tab){ ver("correo"); abrirHilo({ hiloId:d.hiloId, id:"", categoria:"curso", fechaISO:"", correo:d.correo||"" }); APP.tabHilo = tab; };
  if($("btnVerHilo")) $("btnVerHilo").addEventListener("click", function(){ abrirHiloDe("resp"); });
  if($("btnPedirDatos")) $("btnPedirDatos").addEventListener("click", function(){ abrirHiloDe("datos"); });
  if($("btnReclasificar")) $("btnReclasificar").addEventListener("click", function(){
    var fin = ocupado(this, "Cambiando…");
    srv("apiReclasificar", d.codigo, this.dataset.tipo).then(trasGestion(fin, "Tipo de PQRS actualizado.")).catch(fallo(fin));
  });
  if($("btnMantener")) $("btnMantener").addEventListener("click", function(){
    var fin = ocupado(this, "…");
    srv("apiReclasificar", d.codigo, d.tipoPqrs).then(trasGestion(fin, "Se mantiene el tipo registrado.")).catch(fallo(fin));
  });
  if($("btnEnviarArea")) $("btnEnviarArea").addEventListener("click", enviarAlArea);
  activarDetalleV8(d);
  if($("btnGuardarRtaArea")) $("btnGuardarRtaArea").addEventListener("click", guardarRtaArea);
  if($("btnResponder")) $("btnResponder").addEventListener("click", responderUsuario);
  if($("selPlantilla")) $("selPlantilla").addEventListener("change", function(){
    var i = $("selPlantilla").value; if(i === "") return;
    var pl = APP.plantillas[parseInt(i,10)]; if(!pl) return;
    var t = pl.texto.replace(/\{radicado\}/g, d.codigo || "").replace(/\{nombre\}/g, d.nombreSolicitante || "")
      .replace(/\{tipo\}/g, d.tipoPqrs || "").replace(/\{sede\}/g, d.sede || "").replace(/\{servicio\}/g, d.servicio || "");
    var actual = $("txtRtaUsuario").value.trim();
    $("txtRtaUsuario").value = actual ? actual + "\n\n" + t : t;
    $("txtRtaUsuario").focus();
  });
  if($("btnUsarGestion")) $("btnUsarGestion").addEventListener("click", function(){
    var g = (APP.detalle.respuestaArea || "").trim();
    if(!g){ aviso("detAviso","El área todavía no ha registrado su gestión.","err"); return; }
    var actual = $("txtRtaUsuario").value.trim();
    $("txtRtaUsuario").value = actual ? actual + "\n\n" + g : g;
  });
  if($("btnNuevaPlantilla")) $("btnNuevaPlantilla").addEventListener("click", function(){
    var texto = $("txtRtaUsuario").value.trim();
    if(!texto){ aviso("detAviso","Escribe primero la respuesta que quieres guardar.","err"); return; }
    var nombre = (APP.detalle.tipologia || APP.detalle.tipoPqrs || "Respuesta") + " · " + (APP.detalle.servicio || "general");
    srv("apiGuardarPlantilla", nombre, texto).then(function(r){
      if(r.ok){ APP.plantillas = r.plantillas; aviso("detAviso","Guardada como plantilla: "+esc(nombre),"ok"); }
      else aviso("detAviso", esc(r.mensaje), "err");
    });
  });
  if($("btnReenviarArea")) $("btnReenviarArea").addEventListener("click", function(){ reenviar("area", this); });
  if($("btnReenviarUsuario")) $("btnReenviarUsuario").addEventListener("click", function(){ reenviar("usuario", this); });
}

function trasGestion(fin, mensajeOk){
  return function(r){
    fin();
    if(r && r.ok===false){ aviso("detAviso", esc(r.mensaje), "err"); return; }
    pintarDetalle(r);
    var extra = "";
    if(r.aviso) extra = " " + Object.keys(r.aviso).map(function(k){ return k+": "+r.aviso[k]; }).join(" · ");
    aviso("detAviso", mensajeOk+esc(extra), "ok");
    toast({ tipo:"area", titulo:mensajeOk, texto:r.codigo, dur:5000 });
  };
}
function fallo(fin){ return function(e){ fin(); aviso("detAviso", msgErr(e), "err"); }; }
function enviarAlArea(){
  var id=$("selArea").value, nota=$("notaArea").value;
  if(!id){ aviso("detAviso","Selecciona el área responsable.","err"); return; }
  var fin=ocupado("btnEnviarArea","Enviando…");
  var esRedir = !!APP.detalle.correoResponsable;
  srv(esRedir ? "apiRedireccionar" : "apiEnviarAlArea", APP.detalle.codigo, id, nota)
    .then(trasGestion(fin, esRedir ? "PQRS redireccionada." : (APP.detalle.esFelicitacion ? "Felicitación entregada al área y cerrada." : "PQRS enviada al área y usuario notificado.")))
    .catch(fallo(fin));
}
function guardarRtaArea(){
  var t=$("txtRtaArea").value;
  if(!t){ aviso("detAviso","Pega la respuesta que envió el área.","err"); return; }
  var fin=ocupado("btnGuardarRtaArea","Guardando…");
  srv("apiRegistrarRespuestaArea", APP.detalle.codigo, t, $("fRtaArea").value)
    .then(trasGestion(fin,"Respuesta del área registrada.")).catch(fallo(fin));
}
function responderUsuario(){
  var t=$("txtRtaUsuario").value;
  if(!t){ aviso("detAviso","Escribe la respuesta para el usuario.","err"); return; }
  var fin=ocupado("btnResponder","Enviando…");
  srv("apiResponderUsuario", APP.detalle.codigo, t, true)
    .then(trasGestion(fin,"Respuesta enviada y PQRS cerrada.")).catch(fallo(fin));
}
function reenviar(tipo, boton){
  var fin = ocupado(boton, "Reenviando…");
  srv("apiReenviar", APP.detalle.codigo, tipo).then(function(r){
    fin(); aviso("detAviso", esc(r.mensaje), r.ok?"ok":"err");
  }).catch(fallo(fin));
}

/* ============================ RADICAR ============================ */
$("btnRadicar").addEventListener("click", function(){
  aviso("radAviso","");
  var d = {};
  ["canal","fechaPqrs","fechaRecepcion","fechaRadicacion","tipoSolicitante","tipoDocSolicitante",
   "numDocSolicitante","nombreSolicitante","telefono","correo","direccion","tipoDocAfiliado",
   "numDocAfiliado","nombreAfiliado","edad","sexo","poblacion","eps","regimen","sede","servicio",
   "servicioEspecifico","modalidad","tipoPqrs","entidad","tipologia","descripcion","observaciones"]
   .forEach(function(k){ d[k]=val("r_"+k); });
  var aut = document.querySelector('input[name="r_aut"]:checked');
  d.autorizacionDatos = (aut ? aut.value : "Sí autoriza") + " · " + new Date().toLocaleDateString("es-CO");
  if(aut && aut.value==="Anónima"){ d.nombreSolicitante = d.nombreSolicitante || "Anónimo"; }
  var faltan=[];
  if(!d.fechaRecepcion) faltan.push("Fecha de recepción");
  if(!d.fechaRadicacion) faltan.push("Fecha de radicación");
  if(!d.tipoPqrs) faltan.push("Tipo de PQRS");
  if(!d.descripcion) faltan.push("Descripción");
  if(faltan.length){ aviso("radAviso","Completa: <b>"+faltan.join(", ")+"</b>","err"); window.scrollTo({top:0,behavior:"smooth"}); return; }
  var fin=ocupado("btnRadicar","Radicando…");
  d.diferir = true;   // v8.2: el radicado se muestra al instante; acuse y avisos salen en un segundo paso
  srv("apiRadicar", d).then(function(r){
    fin();
    if(!r.ok){ aviso("radAviso", esc(r.mensaje), "err"); return; }
    APP.ultimoCodigo = r.codigo; APP.propios[r.codigo] = true;
    $("radExito").querySelector(".cod").textContent = r.codigo;
    if(r.sugerido) toast({ tipo:"correo", titulo:"Revisa el tipo de PQRS", texto:"El texto parece una "+r.sugerido+". Puedes cambiarlo al abrir el caso.", dur:9000 });
    var rg = r.riesgo || {};
    $("radResumen").innerHTML =
      (rg.nivel ? '<div><span>Nivel de riesgo</span><span class="alerta">'+esc(rg.nivel)+(rg.horas?" · "+rg.horas+" horas":"")+'</span></div>' : '')+
      '<div><span>Fecha límite de respuesta</span><span>'+esc(r.fechaMax)+'</span></div>'+

function descargarXlsx(nombre, b64){
  var bin = atob(b64), u8 = new Uint8Array(bin.length);
  for(var i=0;i<bin.length;i++) u8[i] = bin.charCodeAt(i);
  var tipo = "application/vnd.openxmlformats-officedocument.spreadsheetml.sheet", href;
  try { href = URL.createObjectURL(new Blob([u8], { type:tipo })); } catch(e){ href = "data:"+tipo+";base64,"+b64; }
  var a = document.createElement("a"); a.href = href; a.download = nombre; document.body.appendChild(a); a.click(); document.body.removeChild(a);
}

  }).catch(function(e){ fin(); toast({ tipo:"err", titulo:"No se pudo exportar", texto:String(e && e.message || e), dur:9000 }); });
}

    inp.addEventListener("input", function(){ inp.classList.toggle("falta", !inp.value.trim()); });
  });
  actualizarCambiosResp();
}
/* Cambios pendientes del directorio: se calculan igual al mostrarlos y al guardar. */
function cambiosResp(){
  var cambios = [];
  Array.prototype.slice.call(document.querySelectorAll(".resp-fila[data-i]")).forEach(function(f){
    var i = parseInt(f.dataset.i,10), r = APP.responsables[i], datos = { fila:r.fila };
    var distinto = !r.fila;
    f.querySelectorAll("input").forEach(function(inp){
      datos[inp.dataset.k] = inp.value.trim();
      var antes = r[inp.dataset.k]; if(antes && antes.join) antes = antes.join("; ");
      if((antes||"") !== datos[inp.dataset.k]) distinto = true;
    });
    f.classList.toggle("editado", distinto && !!r.fila);
    if(datos.area && distinto) cambios.push(datos);
  });
  return cambios;
}
function actualizarCambiosResp(){
  var n = cambiosResp().length, e = $("respEstado"), barra = $("barraResp");
  if(!e) return;
  e.textContent = n ? n + (n===1 ? " cambio sin guardar" : " cambios sin guardar") : "Sin cambios por guardar";
  barra.classList.toggle("pendiente", n > 0);
}
$("respLista").addEventListener("input", actualizarCambiosResp);
$("respBuscar").addEventListener("input", pintarResponsables);
$("btnNuevoResp").addEventListener("click", function(){
  $("respBuscar").value = "";
  APP.responsables.push({ id:"", area:"", nombre:"", cargo:"", correo:"", telefono:"", activo:true, fila:null, servicios:[], sedes:[], palabras:[], copia:[] });
  pintarResponsables();
  var ult = $("respLista").querySelector(".resp-fila.nuevo:last-child input");
  if(ult){ ult.focus({ preventScroll:true }); ult.scrollIntoView({ block:"center", behavior:"smooth" }); }
});
$("btnGuardarResp").addEventListener("click", function(){
  var cambios = cambiosResp();
  if(!cambios.length){ aviso("respAviso","No hay cambios por guardar.","info"); return; }
  var fin = ocupado("btnGuardarResp","Guardando "+cambios.length+"…");
  var errores = [];
  var siguiente = function(k){
    if(k>=cambios.length){
      fin(); pintarResponsables();
      aviso("respAviso", errores.length ? errores.join("<br>") : cambios.length+" responsable(s) guardado(s).", errores.length ? "err" : "ok");
      return;
    }
    srv("apiGuardarResponsable", cambios[k]).then(function(res){
      if(!res.ok) errores.push(esc(cambios[k].area)+": "+esc(res.mensaje)); else APP.responsables = res.responsables;
      siguiente(k+1);
    }).catch(function(e){ errores.push(msgErr(e)); siguiente(k+1); });
  };
  siguiente(0);
});

/* ============================ CONFIGURACIÓN ============================ */
$("btnLeerForm").addEventListener("click", function(){
  aviso("cfgAviso","Leyendo el formulario…","info");
  var fin = ocupado("btnLeerForm","Leyendo…");
  srv("apiLeerFormulario", $("cfgUrl").value).then(function(r){
    fin();
    if(!r.ok){ aviso("cfgAviso", esc(r.mensaje), "err"); return; }
    APP.mapeo = r;
    aviso("cfgAviso","Encontré "+r.preguntas.length+" preguntas (origen: "+esc(r.origen)+").","ok");
    $("cfgPares").innerHTML = r.preguntas.map(function(p){
      var actual = r.mapeo[p] || r.sugerido[p] || "";
      return '<div class="mapeo"><div class="q" title="'+esc(p)+'">'+esc(p)+'</div><div class="fl">'+ic("flecha","s")+'</div>'+
        '<select data-q="'+esc(p)+'">'+ r.campos.map(function(c){
          return '<option value="'+esc(c)+'"'+(c===actual?" selected":"")+'>'+esc(c)+'</option>';
        }).join("") + '<option value=""'+(actual?"":" selected")+'>(no importar)</option></select></div>';
    }).join("");
    $("cfgMapeo").hidden = false;
  }).catch(function(e){ fin(); aviso("cfgAviso", msgErr(e), "err"); });
});
function importarForm(idBoton, contenedor){
  var fin = ocupado(idBoton, "Importando…");
  srv("apiImportarRespuestasForm", { notificar: $("cfgAcuse") ? $("cfgAcuse").checked : true }).then(function(r){
    fin();
    if(!r.ok){ aviso(contenedor, esc(r.mensaje), "err"); return; }
    var html = esc(r.mensaje);
    if(r.noReconocidos && r.noReconocidos.length){
      html += '<br><br><b>Valores que no están en las listas</b> (se guardaron tal cual; agrégalos en la hoja Config o corrígelos en la bandeja):<ul style="margin:6px 0 0;padding-left:18px">'+
        r.noReconocidos.map(function(x){ return '<li>'+esc(x)+'</li>'; }).join("")+'</ul>';
    }
    aviso(contenedor, html, r.importadas ? "ok" : "info");
  }).catch(function(e){ fin(); aviso(contenedor, msgErr(e), "err"); });
}
$("btnImportarEstado").addEventListener("click", function(){ importarForm("btnImportarEstado", "cfgAviso"); });
$("btnVerificarForm").addEventListener("click", function(){
  $("cfgEstado").innerHTML = esqueleto(3);
  srv("apiEstadoFormulario").then(function(e){
    var fila = function(k,v,alerta){ return '<div><span>'+k+'</span><span'+(alerta?' style="color:var(--bad)"':'')+'>'+esc(v)+'</span></div>'; };
    var html = '<div class="ficha">'+
      fila("Formulario vinculado", e.vinculado ? "Sí — hoja «"+e.hoja+"»" : "No", !e.vinculado)+
      fila("Respuestas en el formulario", e.respuestas)+
      fila("Preguntas con equivalencia", e.mapeadas, !e.mapeadas)+
      fila("Ya radicadas en el consolidado", e.importadas)+
      fila("Pendientes por importar", e.pendientes, e.pendientes>0)+
      fila("Disparador automático", e.disparador ? "Activo" : "No instalado", !e.disparador)+
    '</div>';
    if(e.problemas && e.problemas.length){
      html += '<div class="aviso err" style="margin-top:12px">'+ic("alerta","s")+'<div><b>Falta resolver:</b><ul style="margin:8px 0 0;padding-left:18px">'+
        e.problemas.map(function(x){ return '<li>'+esc(x)+'</li>'; }).join("")+'</ul></div></div>';
    } else if(e.pendientes > 0){
      html += '<div class="aviso info" style="margin-top:12px">'+ic("pulso","s")+'<div>Todo está conectado. Hay '+e.pendientes+' respuesta(s) sin radicar: pulsa «Importar respuestas ahora».</div></div>';
    } else {
      html += '<div class="aviso ok" style="margin-top:12px">'+ic("check","s")+'<div>El canal funciona y no hay respuestas pendientes.</div></div>';
    }
    $("cfgEstado").innerHTML = html;
  }).catch(function(err){ $("cfgEstado").innerHTML = '<div class="aviso err">'+ic("alerta","s")+'<div>'+msgErr(err)+'</div></div>'; });
});
$("btnGuardarMapeo").addEventListener("click", function(){
  var mapa = {};
  document.querySelectorAll("#cfgPares select").forEach(function(s){ mapa[s.dataset.q] = s.value; });
  var fin = ocupado("btnGuardarMapeo","Guardando…");
  srv("apiGuardarMapeo", mapa, APP.mapeo.idForm, APP.mapeo.hojaRespuestas).then(function(){
    fin(); aviso("cfgAviso","Equivalencias guardadas. Ya puedes importar las respuestas.","ok");
  }).catch(function(e){ fin(); aviso("cfgAviso", msgErr(e), "err"); });
});
$("btnImportar").addEventListener("click", function(){ importarForm("btnImportar", "cfgAviso"); });
</script>

<script>
/* Sugerencia del tipo de PQRS mientras se tabula (no cambia nada por sí sola). */
(function(){
  var t = null;
  function revisar(){
    var txt = $("r_descripcion").value.trim(); if(txt.length < 25) { $("sugTipo").innerHTML = ""; return; }
    srvSilencioso("apiSugerirTipo", txt, $("r_tipoPqrs").value).then(function(r){
      if(!r || !r.tipo || r.confianza === "baja" || norm(r.tipo) === norm($("r_tipoPqrs").value)) { $("sugTipo").innerHTML = ""; return; }
      $("sugTipo").innerHTML = '<div class="banda-sug" style="margin:8px 0 0">'+ic("alerta","s")+'<div style="flex:1">El texto parece una <b>'+esc(r.tipo)+'</b>'+
        (r.razones && r.razones.length ? ' (señales: '+esc(r.razones.slice(0,3).join(", "))+')' : '')+'.</div>'+
        '<button class="b pri mini" type="button" id="usarSug">Usar '+esc(r.tipo)+'</button></div>';
      $("usarSug").addEventListener("click", function(){
        var s = $("r_tipoPqrs"); for(var i=0;i<s.options.length;i++) if(norm(s.options[i].value)===norm(r.tipo)) s.selectedIndex = i;
        $("sugTipo").innerHTML = "";
      });
    }).catch(function(){});
  }
  $("r_descripcion").addEventListener("input", function(){ clearTimeout(t); t = setTimeout(revisar, 900); });
  $("r_tipoPqrs").addEventListener("change", revisar);
})();
</script>
