<script>
/* ============================ ACCESO ============================ */
function guardarToken(t, recordar){
  TOKEN = t;
  try { sessionStorage.setItem("pqrs_token", t); if(recordar) localStorage.setItem("pqrs_token", t); else localStorage.removeItem("pqrs_token"); } catch(e) {}
}
function borrarToken(){ TOKEN = null; try { sessionStorage.removeItem("pqrs_token"); localStorage.removeItem("pqrs_token"); } catch(e) {} }
function campoClave(id, etiqueta, auto){
  return '<label for="'+id+'">'+etiqueta+'</label><div class="campo-clave"><input type="password" id="'+id+'" autocomplete="'+(auto||"current-password")+'">'+
    '<button type="button" data-ver-clave="'+id+'" aria-label="Mostrar">'+ic("ojo","s")+'</button></div>';
}
function activarVerClave(raiz){
  raiz.querySelectorAll("[data-ver-clave]").forEach(function(b){
    b.addEventListener("click", function(){ var i=$(b.dataset.verClave); i.type = i.type==="password" ? "text" : "password"; });
  });
}
var FRONT_VERSION = "9.7";
function pintarVersion(estado){
  var el = $("accVersion");
  if(!el){ el = document.createElement("div"); el.id = "accVersion"; el.className = "hint"; el.style.cssText = "text-align:center;margin-top:10px;font-size:12px";
    var b = $("btnAcceso"); if(b && b.parentNode) b.parentNode.appendChild(el); }
  var sv = estado && estado.version ? String(estado.version).split(" ")[0] : "";
  var ok = sv && sv === FRONT_VERSION;
  el.innerHTML = "Pantalla " + esc(FRONT_VERSION) + " · Servidor " + (sv ? esc(sv) : "<b>desactualizado (publica el Codigo.gs nuevo)</b>") +
    (sv && !ok ? " · <b>no coinciden</b>" : "");
  el.style.color = ok ? "" : "#E20A31";
}
function mostrarAcceso(estado, mensaje){
  pintarVersion(estado);
  $("app").hidden = true; $("acceso").hidden = false;
  if(estado && estado.logo && !window.IMG_MIRED_B) $("logoAcceso").src = "data:image/png;base64," + estado.logo;
  aviso("accAviso", mensaje ? esc(mensaje) : "", "err");
  if(estado && estado.hayUsuarios === false){
    $("accTitulo").textContent = "Crear el administrador";
    $("accSub").textContent = "Aún no hay usuarios. La primera cuenta será la del administrador de la plataforma, que luego crea los usuarios de cada técnico.";
    $("accCampos").innerHTML = '<label for="a_nombre">Nombre completo</label><input id="a_nombre" autocomplete="name">'+
      '<label for="a_usuario">Usuario</label><input id="a_usuario" autocomplete="username" placeholder="p. ej. siau.lider">'+
      '<label for="a_correo">Correo (para avisos)</label><input id="a_correo" type="email" autocomplete="email">'+
      campoClave("a_clave","Contraseña","new-password")+'<div class="hint">Mínimo 10 caracteres, con mayúscula, minúscula y número. No uses tu usuario ni palabras comunes.</div>'+campoClave("a_clave2","Repite la contraseña","new-password");
    $("btnAcceso").textContent = "Crear administrador e ingresar";
    $("btnAcceso").onclick = function(){
      if(val("a_clave") !== val("a_clave2")){ aviso("accAviso","Las contraseñas no coinciden.","err"); return; }
      var fin = ocupado("btnAcceso","Creando…");
      pub("crearPrimerAdministrador", { nombre:val("a_nombre"), usuario:val("a_usuario"), correo:val("a_correo"), clave:$("a_clave").value })
        .then(function(r){ fin(); if(!r.ok){ aviso("accAviso", esc(r.mensaje), "err"); return; } guardarToken(r.token, true); cargarApp(); })
        .catch(function(e){ fin(); aviso("accAviso", msgErr(e), "err"); });
    };
  } else {
    $("accTitulo").textContent = "Ingresar";
    $("accSub").textContent = "Usa el usuario y la contraseña que te asignó el administrador.";
    $("accCampos").innerHTML = '<label for="a_usuario">Usuario</label><input id="a_usuario" autocomplete="username">'+campoClave("a_clave","Contraseña")+
      '<label class="chk"><input type="checkbox" id="a_recordar" checked> Mantener la sesión en este equipo</label>';
    $("btnAcceso").textContent = "Ingresar";
    $("btnAcceso").onclick = function(){
      if(!val("a_usuario") || !$("a_clave").value){ aviso("accAviso","Escribe tu usuario y tu contraseña.","err"); return; }
      var fin = ocupado("btnAcceso","Ingresando…");
      pub("iniciarSesion", val("a_usuario"), $("a_clave").value).then(function(r){
        fin();
        if(!r.ok){ aviso("accAviso", esc(r.mensaje), "err"); return; }
        guardarToken(r.token, $("a_recordar").checked); cargarApp();
      }).catch(function(e){ fin(); aviso("accAviso", msgErr(e), "err"); });
    };
  }
  activarVerClave($("accCampos"));
  $("accCampos").querySelectorAll("input").forEach(function(i){ i.addEventListener("keydown", function(e){ if(e.key==="Enter") $("btnAcceso").click(); }); });
  setTimeout(function(){   /* no roba el foco si la persona ya empezó a escribir */
    var p = $("accCampos").querySelector("input");
    if(p && !$("accCampos").contains(document.activeElement) && !p.value) p.focus();
  }, 50);
}
function sesionTerminada(msg){
  borrarToken();
  pub("estadoAcceso").then(function(e){ mostrarAcceso(e, msg || "Tu sesión terminó. Vuelve a ingresar."); });
}
function iniciales(n){ return String(n||"?").trim().split(/\s+/).slice(0,2).map(function(x){ return x.charAt(0).toUpperCase(); }).join("") || "?"; }
function aplicarSesion(){
  var s = APP.sesion, p = s.puede || {};
  document.querySelectorAll("[data-perm]").forEach(function(el){ el.hidden = !p[el.dataset.perm]; });
  ["avatar","avatar2","latAvatar"].forEach(function(id){ $(id).textContent = iniciales(s.nombre); });
  $("latRol").textContent = s.rol + (s.todas ? " · todas las sedes" : " · " + s.sedes.length + " sede(s)");
  $("perfilNombre").textContent = s.nombre; $("perfilRol").textContent = s.rol + " · " + s.usuario;
  var sedesTxt = s.todas ? "Todas las sedes" : s.sedes.join(", ");
  $("sedesChip").textContent = s.todas ? "Todas las sedes" : (s.sedes.length === 1 ? s.sedes[0] : s.sedes.length + " sedes asignadas");
  $("sedesChip").title = sedesTxt;
  if(s.debeCambiar) setTimeout(function(){ cambiarClave(true); }, 600);
}
function cambiarClave(obligatorio){
  $("modal").innerHTML = '<div class="velo" id="velo"><div class="modal" style="width:min(440px,100%)"><div class="modal-cab"><div><h3>'+(obligatorio?"Crea tu contraseña":"Cambiar mi contraseña")+'</h3>'+
    '<p>'+(obligatorio?"Estás usando una contraseña temporal asignada por el administrador.":"Mínimo 10 caracteres, con mayúscula, minúscula y número (sin tu usuario ni palabras comunes).")+'</p></div>'+
    (obligatorio?'':'<button class="cerrar" type="button" id="btnCerrarModal">'+ic("x")+'</button>')+'</div>'+
    '<div class="modal-cuerpo"><div id="claveAviso"></div>'+campoClave("c_actual", obligatorio?"Contraseña temporal":"Contraseña actual")+
    campoClave("c_nueva","Nueva contraseña","new-password")+campoClave("c_nueva2","Repite la nueva contraseña","new-password")+
    '<div class="acciones"><button class="b pri" type="button" id="btnGuardarClave">Guardar contraseña</button></div></div></div></div>';
  $("modal").hidden = false; activarVerClave($("modal"));
  if($("btnCerrarModal")) $("btnCerrarModal").addEventListener("click", cerrarModal);
  $("btnGuardarClave").addEventListener("click", function(){
    if($("c_nueva").value !== $("c_nueva2").value){ aviso("claveAviso","Las contraseñas no coinciden.","err"); return; }
    var fin = ocupado("btnGuardarClave","Guardando…");
    srv("apiCambiarMiClave", $("c_actual").value, $("c_nueva").value).then(function(r){
      fin(); if(!r.ok){ aviso("claveAviso", esc(r.mensaje), "err"); return; }
      APP.sesion.debeCambiar = false; cerrarModal(); toast({ tipo:"area", titulo:"Contraseña actualizada", texto:"Úsala en tu próximo ingreso." });
      if(obligatorio){ try { window.riverinoBienvenida(); } catch(e) {} }   /* usuario nuevo: Riverino le da la bienvenida */
    }).catch(function(e){ fin(); aviso("claveAviso", msgErr(e), "err"); });
  });
}

/* ============================ BARRA SUPERIOR ============================ */
function cerrarLateral(){ $("lateral").classList.remove("abierto"); $("veloLat").classList.remove("on"); }
$("btnMenu").addEventListener("click", function(){ $("lateral").classList.add("abierto"); $("veloLat").classList.add("on"); });
$("tabMas").addEventListener("click", function(){ $("lateral").classList.add("abierto"); $("veloLat").classList.add("on"); });
$("veloLat").addEventListener("click", cerrarLateral);
$("btnPerfil").addEventListener("click", function(e){ e.stopPropagation(); $("centro").hidden = true; $("menuPerfil").hidden = !$("menuPerfil").hidden; });
document.addEventListener("click", function(e){ if(!$("menuPerfil").hidden && !$("menuPerfil").contains(e.target)) $("menuPerfil").hidden = true; });
$("btnMiClave").addEventListener("click", function(){ $("menuPerfil").hidden = true; cambiarClave(false); });
var ARRANQUE_HTML = $("arranque").innerHTML;
/* v7.1: cerrar sesión sin recargar (recargar el marco de Apps Script dejaba la página en blanco). */
function limpiarApp(){
  if(CICLO){ clearInterval(CICLO); CICLO = null; }
  try { if(window.riverinoCerrar) window.riverinoCerrar(); } catch(e) {}
  APP = JSON.parse(APP_INICIAL);
  $("menuPerfil").hidden = true; $("centro").hidden = true; cerrarModal(); cerrarLateral();
  $("toasts").innerHTML = ""; $("centroLista").innerHTML = ""; $("campanaN").hidden = true;
  ["detalleCuerpo","listaBandeja","inicioCuerpo","listaCorreos","vistaHilo","usrLista","tableroCuerpo","respLista","radResumen","segCorreo","tablaEntidades","tablaCategorias","meses","anios"].forEach(function(id){ if($(id)) $(id).innerHTML = ""; });
  ["avatar","avatar2","latAvatar"].forEach(function(id){ $(id).textContent = "?"; });
  $("quien").textContent = ""; $("latRol").textContent = ""; $("perfilNombre").textContent = ""; $("perfilRol").textContent = "";
  $("arranque").innerHTML = ARRANQUE_HTML; $("arranque").hidden = false;
  document.querySelectorAll("main > section[id^='v-']").forEach(function(s){ s.hidden = true; });
}
function salir(){
  var t = TOKEN; borrarToken(); limpiarApp();
  mostrarAcceso({ hayUsuarios:true }, "");   // ya había usuarios: se muestra el ingreso de inmediato
  aviso("accAviso", "Cerraste sesión. Para volver a entrar escribe tu usuario y tu contraseña.", "ok");
  pub("cerrarSesion", t).catch(function(){});
}
$("btnSalir").addEventListener("click", salir);
$("buscarRad").addEventListener("keydown", function(e){
  if(e.key !== "Enter") return;
  var q = this.value.trim(); if(!q) return;
  if(/^[A-Z]{2,6}-\d{4}-\d{2}-\d{3,}$/i.test(q)) { abrirDetalle(q.toUpperCase()); return; }
  $("fTexto").value = q; irAEtapa("todas");
});

/* ============================ SONIDO Y AVISOS DEL ESCRITORIO ============================ */
var SONIDO = true;
try { SONIDO = localStorage.getItem("pqrs_sonido") !== "0"; } catch(e) {}
function pintarSonido(){ $("btnSonido").classList.toggle("apagado", !SONIDO); $("btnSonido").innerHTML = ic(SONIDO ? "sonido" : "silencio"); $("btnSonido").title = SONIDO ? "Sonido activado" : "Sonido desactivado"; }
$("btnSonido").addEventListener("click", function(){
  SONIDO = !SONIDO; try { localStorage.setItem("pqrs_sonido", SONIDO ? "1" : "0"); } catch(e) {}
  pintarSonido(); if(SONIDO) sonar("Normal");
});
function contextoAudio(){
  var AC = window.AudioContext || window.webkitAudioContext; if(!AC) return null;
  if(!APP.ac) APP.ac = new AC();
  if(APP.ac.state === "suspended") APP.ac.resume();
  return APP.ac;
}
document.addEventListener("click", function(){ if(SONIDO) contextoAudio(); }, { once:true });
/* Tono distinto según el caso:
   Vital       = sirena de alarma (dos tonos que suben y bajan, tres ciclos)
   Ente        = tres toques graves (correo de un ente de control)
   Felicitación= arpegio alegre (do-mi-sol-do)
   Crítica = cuatro pulsos, Alta = dos, normal = campanita. */
function sonar(prioridad){
  if(!SONIDO) return;
  try {
    var ac = contextoAudio(); if(!ac) return;
    if(prioridad === "Vital"){
      var t0 = ac.currentTime, o = ac.createOscillator(), g = ac.createGain();
      o.type = "sawtooth"; o.frequency.setValueAtTime(660, t0);
      for(var k=0;k<3;k++){ o.frequency.linearRampToValueAtTime(1320, t0+k*0.7+0.35); o.frequency.linearRampToValueAtTime(660, t0+k*0.7+0.7); }
      g.gain.setValueAtTime(0.0001, t0); g.gain.exponentialRampToValueAtTime(0.06, t0+0.05); g.gain.setValueAtTime(0.06, t0+2.0); g.gain.exponentialRampToValueAtTime(0.0001, t0+2.15);
      o.connect(g); g.connect(ac.destination); o.start(t0); o.stop(t0+2.2);
      return;
    }
    if(prioridad === "Felicitación"){
      [523,659,784,1047,1319].forEach(function(f,i){
        var o = ac.createOscillator(), g = ac.createGain(), t = ac.currentTime + i*0.11;
        o.type = "triangle"; o.frequency.value = f;
        g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(0.16, t+0.02); g.gain.exponentialRampToValueAtTime(0.0001, t+0.5);
        o.connect(g); g.connect(ac.destination); o.start(t); o.stop(t+0.52);
      });
      return;
    }
    var notas = prioridad === "Ente" ? [392,392,392] : (prioridad === "Crítica" ? [988,740,988,740] : (prioridad === "Alta" ? [880,1175] : [784,1047]));
    notas.forEach(function(f,i){
      var o = ac.createOscillator(), g = ac.createGain(), t = ac.currentTime + i*0.2;
      o.type = prioridad === "Crítica" || prioridad === "Ente" ? "square" : "sine"; o.frequency.value = f;
      g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(prioridad === "Crítica" ? 0.08 : 0.18, t+0.02); g.gain.exponentialRampToValueAtTime(0.0001, t+0.18);
      o.connect(g); g.connect(ac.destination); o.start(t); o.stop(t+0.19);
    });
  } catch(e) {}
}
/* Aviso del sistema operativo: puede verse en la pantalla bloqueada, así que no lleva datos del caso (solo el radicado). */
function escritorio(titulo){
  try { if(window.Notification && Notification.permission === "granted") new Notification(titulo, { body: "Abre la plataforma de PQRS para ver el detalle.", tag: titulo }); } catch(e) {}
}
$("btnEscritorio").addEventListener("click", function(){
  $("menuPerfil").hidden = true;
  if(!window.Notification){ toast({ tipo:"err", titulo:"Avisos del escritorio no disponibles", texto:"Tu navegador no los admite. Usa Google Chat (Configuración ▸ Automatización)." }); return; }
  try {
    Notification.requestPermission().then(function(p){
      if(p === "granted"){ escritorio("Avisos activados", "Verás aquí las PQRS nuevas y las alertas."); toast({ tipo:"area", titulo:"Avisos del escritorio activados", texto:"Llegarán aunque estés en otra pestaña." }); }
      else toast({ tipo:"err", titulo:"El navegador no dio permiso", texto:"Google Apps Script puede bloquearlos. Para avisos fuera de la plataforma usa Google Chat o el correo." });
    }).catch(function(){ toast({ tipo:"err", titulo:"No se pudieron activar", texto:"Usa los avisos de Google Chat o del correo." }); });
  } catch(e) { toast({ tipo:"err", titulo:"No se pudieron activar", texto:"Usa los avisos de Google Chat o del correo." }); }
});

/* ============================ USUARIOS ============================ */
function cargarUsuarios(){
  $("usrLista").innerHTML = esqueleto(3);
  srv("apiUsuarios").then(function(r){ if(!r.ok){ aviso("usrAviso", esc(r.mensaje), "err"); return; } APP.usr = r; pintarUsuarios(); cargarAuditoria(); })
    .catch(function(e){ aviso("usrAviso", msgErr(e), "err"); });
}
/* v8.4 · Auditoría de accesos y cambios (ingresos, bloqueos, contraseñas, usuarios, exportaciones). Solo administrador. */
function cargarAuditoria(){
  if(!$("audLista")) return;
  $("audLista").innerHTML = esqueleto(3);
  srvSilencioso("apiAuditoria", { texto: $("audBuscar") ? $("audBuscar").value : "", limite: 150 }).then(function(r){
    if(!r.ok || !r.items.length){ $("audLista").innerHTML = vacio("escudo","Todavía no hay eventos registrados."); return; }
    $("audLista").innerHTML = '<div class="aud-fila aud-cab"><span>Fecha</span><span>Usuario</span><span>Evento</span><span>Detalle</span></div>'+
      r.items.map(function(x){ return '<div class="aud-fila'+(x.alerta?' alerta':'')+'"><span>'+esc(x.fecha)+'</span><span>'+esc(x.usuario)+'</span><b>'+esc(x.evento)+'</b><span>'+esc(x.detalle)+'</span></div>'; }).join("");
  }).catch(function(e){ $("audLista").innerHTML = '<div class="aviso err">'+ic("alerta","s")+'<div>'+msgErr(e)+'</div></div>'; });
}
$("btnAudActualizar").addEventListener("click", cargarAuditoria);
$("audBuscar").addEventListener("input", function(){ clearTimeout(APP._audT); APP._audT = setTimeout(cargarAuditoria, 350); });
/* Enlace de ingreso para compartir con los técnicos (no necesitan cuenta de Google: entran con usuario y contraseña).
   v9.2: el administrador lo cambia aquí mismo («Cambiar enlace»); se guarda en la propiedad URL_PLATAFORMA del proyecto. */
var PORTAL_URL = "https://rivcarii.github.io/DEFINIDO/portal/";
/* El enlace de ingreso para las personas es el del portal (GitHub Pages). Si el servidor aún devuelve el de Apps Script, se corrige aquí. */
function enlaceVisible(e){
  var o = {}, k; for(k in (e||{})) o[k] = e[k];
  if(o.url && /script\.google\.com/.test(o.url) && !o.prueba){ o.appsScript = o.url; o.url = PORTAL_URL; }
  return o;
}
function pintarEnlace(e){
  e = enlaceVisible(e);
  var ok = !!e.url && !e.prueba, abierto = !ok;
  $("usrEnlace").innerHTML = '<div class="enlace-card'+(ok?'':' mal')+'"><div class="enlace-ic">'+ic(ok?"enviar":"alerta")+'</div><div class="enlace-txt">'+
    '<b>'+(ok ? 'Enlace de ingreso para los técnicos' : e.url ? 'Estás usando el enlace de prueba (/dev)' : 'Falta el enlace de la plataforma')+'</b>'+
    '<span>'+(ok ? 'Compártelo con cada técnico junto con su usuario. No necesitan cuenta de Google ni permisos sobre la hoja: todo se ejecuta con la cuenta '+esc(e.cuenta||"de la implementación")+'.'
      : 'Los técnicos no pueden entrar con ese enlace. Pega abajo la «URL de la aplicación web» (termina en <b>/exec</b>): Implementar ▸ Administrar implementaciones ▸ Copiar.')+'</span>'+
    (e.url ? '<code id="enlaceActual">'+esc(e.url)+'</code>' : '')+
    '<span class="hint" id="enlaceVersion">Código publicado: '+esc(e.version||"anterior (publica la versión nueva)")+'</span>'+
    '<form class="enlace-edit" id="enlaceEdit"'+(abierto?'':' hidden')+'><input id="enlaceUrl" type="url" inputmode="url" autocomplete="off" spellcheck="false" aria-label="Enlace de la plataforma" placeholder="https://rivcarii.github.io/DEFINIDO/portal/" value="'+esc(e.url||"")+'">'+
      '<button class="b pri mini" type="submit" id="btnGuardarEnlace">'+ic("check","s")+'Guardar enlace</button>'+
      (ok ? '<button class="b sec mini" type="button" id="btnCancelarEnlace">Cancelar</button>' : '')+
      (e.personalizado ? '<button class="b sec mini" type="button" id="btnEnlaceDefecto">Usar el predeterminado</button>' : '')+'</form>'+
    '</div><div class="enlace-acc">'+
    (ok ? '<button class="b pri mini" type="button" id="btnCopiarEnlace">'+ic("check","s")+'Copiar enlace</button>'+
      '<a class="b sec mini" target="_blank" rel="noopener" href="https://wa.me/?text='+encodeURIComponent("Plataforma de PQRS · MiRed IPS\n"+e.url+"\nIngresa con el usuario y la contraseña temporal que te entregó el administrador.")+'">WhatsApp</a>'+
      '<button class="b sec mini" type="button" id="btnCambiarEnlace">'+ic("link","s")+'Cambiar enlace</button>' : '')+'</div></div>';
  if($("btnCopiarEnlace")) $("btnCopiarEnlace").addEventListener("click", function(){ copiarTexto(e.url, "Enlace copiado"); });
  if($("btnCambiarEnlace")) $("btnCambiarEnlace").addEventListener("click", function(){ $("enlaceEdit").hidden = false; $("enlaceUrl").focus(); $("enlaceUrl").select(); });
  if($("btnCancelarEnlace")) $("btnCancelarEnlace").addEventListener("click", function(){ $("enlaceEdit").hidden = true; });
  if($("btnEnlaceDefecto")) $("btnEnlaceDefecto").addEventListener("click", function(){ guardarEnlace(""); });
  $("enlaceEdit").addEventListener("submit", function(ev){ ev.preventDefault(); guardarEnlace($("enlaceUrl").value); });
}
function guardarEnlace(url){
  srv("apiGuardarEnlace", String(url||"").trim()).then(function(r){
    if(!r || !r.ok){ toast({ tipo:"err", titulo:"No se guardó el enlace", texto: (r && r.mensaje) || "Intenta de nuevo." }); return; }
    if(APP.usr) APP.usr.enlace = r.enlace;
    pintarEnlace(r.enlace);
    toast({ tipo:"area", titulo:"Enlace actualizado", texto:"Las invitaciones, el WhatsApp y los avisos por correo ya usan el enlace nuevo." });
  }).catch(function(err){ toast({ tipo:"err", titulo:"No se guardó el enlace", texto: (err && err.message) || String(err) }); });
}
function copiarTexto(t, msg){
  var hecho = function(){ toast({ tipo:"area", titulo: msg || "Copiado", texto: "" , dur:3000 }); };
  try { navigator.clipboard.writeText(t).then(hecho).catch(function(){ copiaManual(t); hecho(); }); } catch(e){ copiaManual(t); hecho(); }
}
function copiaManual(t){ var a=document.createElement("textarea"); a.value=t; document.body.appendChild(a); a.select(); try{ document.execCommand("copy"); }catch(e){} document.body.removeChild(a); }
function invitacion(u){
  var url = enlaceVisible(APP.usr && APP.usr.enlace).url || "";
  return "Hola " + String(u.nombre||u.usuario).split(" ")[0] + ", ya tienes acceso a la Plataforma de PQRS de MiRed IPS.\n\n" +
    "Enlace: " + url + "\nUsuario: " + u.usuario + "\nContraseña: la temporal que te entregué (la cambiarás al ingresar).\n\n" +
    "No necesitas cuenta de Google. Verás las PQRS de: " + (u.rol === "Administrador" || u.sedes.some(function(x){ return /^todas$/i.test(x); }) ? "todas las sedes" : u.sedes.join(", ")) + ".";
}
function pintarUsuarios(){
  var r = APP.usr, q = norm($("usrBuscar").value);

    ["btnInstalarAcceso","btnInstalarMenu"].forEach(function(id){ var b = document.getElementById(id); if(b) b.hidden = !puede; });
    var ios = document.getElementById("instalarIos");
    if(ios) ios.hidden = !(window.PQRS_API && /iphone|ipad|ipod/i.test(navigator.userAgent) && !standalone());
  }
  function instalar(){
    var e = window.__instalarApp; if(!e) return;
    e.prompt(); e.userChoice.then(function(){ window.__instalarApp = null; pintar(); });
  }
  ["btnInstalarAcceso","btnInstalarMenu"].forEach(function(id){ var b = document.getElementById(id); if(b) b.addEventListener("click", instalar); });
  window.addEventListener("pqrs-instalable", pintar);
  document.addEventListener("DOMContentLoaded", pintar);
})();
</script>
